ode>react nextjs vue svelte astro swiftui react-native flutter nuxtjs nuxt-ui html-tailwind shadcn jetpack-compose threejs angular laravel javafx wpf winui avalonia uno uwp\u003c/code>.\u003c/p>\n\u003cp>Tuning dials for \u003ccode>--design-system\u003c/code>: \u003ccode>--variance 1-10\u003c/code> (minimal to brutalist/bento), \u003ccode>--motion 1-10\u003c/code> (micro-interactions to complex choreography), \u003ccode>--density 1-10\u003c/code> (spacious marketing to dense dashboard).\u003c/p>\n\u003ch3 id=\"install-into-a-project\">Install into a project\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">../scripts/setup.sh --target /path/to/project --client claude   # or all\u003c/code>\u003c/pre>\n\u003cp>That copies each skill into the client's skills directory (\u003ccode>.claude/skills\u003c/code>, \u003ccode>.cursor/skills\u003c/code>, \u003ccode>.agents/skills\u003c/code>, \u003ccode>.gemini/skills\u003c/code>, \u003ccode>.windsurf/skills\u003c/code>, \u003ccode>.github/prompts\u003c/code>) exactly like the upstream installer does.\u003c/p>\n\u003ch3 id=\"updates\">Updates\u003c/h3>\n\u003cp>These copies are snapshots. To refresh from upstream:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">scripts/vendor-update.sh          # re-vendor from both repos\nscripts/vendor-update.sh --check  # report upstream versions only\u003c/code>\u003c/pre>\n\u003cp>Or install the upstream CLI inside a project when you want the newest release:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">npx ui-ux-pro-max-cli@latest init --ai claude     # ai: claude|cursor|codex|gemini|copilot|windsurf|universal|all\u003c/code>\u003c/pre>\n\u003cp>Caveat: the upstream CLI generates localized skill content based on your locale (observed producing Chinese section text in an en_US-adjacent environment). The vendored copies here are the upstream repository's English source, which is why the kit defaults to them.\u003c/p>\n\u003ch3 id=\"provenance-and-licenses\">Provenance and licenses\u003c/h3>\n\u003cul>\u003cli>UI/UX Pro Max and its sibling skills: MIT, (c) Next Level Builder. See \u003ccode>LICENSE-ui-ux-pro-max.txt\u003c/code>.\u003c/li>\u003cli>21st UI skill: ISC, (c) 21st.dev. See \u003ccode>LICENSE-21st-ui.txt\u003c/code>.\u003c/li>\u003cli>Version and commit pins: \u003ccode>UPSTREAM.md\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Skill search results are recommendations. They never override you, the project's rules, or a repository's existing design system, and no private project data should be pasted into queries or persisted output.\u003c/p>", "md": "# Skills\n\nVendored, pinned copies of the design intelligence that this kit installs into projects. Everything here works offline: no API key, no network, no npm install.\n\n| Skill | What it gives an agent | Source |\n|---|---|---|\n| `ui-ux-pro-max/` | 79 styles, 192 product palettes with reasoning, 74 font pairings, 119 UX guidelines, 105 icons, 17 GSAP presets, 25 chart types, 22 stack guides. Searchable via `scripts/search.py`. | [nextlevelbuilder/ui-ux-pro-max-skill](https://github.com/nextlevelbuilder/ui-ux-pro-max-skill) |\n| `ui-styling/` | Tailwind and shadcn/ui styling mechanics, token generation scripts, canvas fonts | same upstream |\n| `design-system/` | token architecture (primitive/semantic/component), component specs, Tailwind integration, slide data | same upstream |\n| `design/` | logo, icon, brand identity, social/banner design workflows, prompt engineering | same upstream |\n| `brand/` | brand guidelines, color and type specifications, asset validation scripts | same upstream |\n| `banner-design/` | banner sizes and style guidance | same upstream |\n| `slides/` | slide deck structure and layout guidance | same upstream |\n| `21st-ui/` | drives the 21st.dev MCP: when to search the catalog, install a component, or generate UI | [21st-dev/magic-mcp](https://github.com/21st-dev/magic-mcp) |\n\n## Use it\n\n```bash\n# full design system for a product (the default first call)\npython3 skills/ui-ux-pro-max/scripts/search.py \"fintech analytics dashboard\" --design-system -p \"Ops Console\"\n\n# persist it for multi-session work\npython3 skills/ui-ux-pro-max/scripts/search.py \"fintech analytics dashboard\" --design-system --persist -p \"Ops Console\" --output-dir .\n\n# targeted lookups\npython3 skills/ui-ux-pro-max/scripts/search.py \"empty state onboarding\" --domain ux\npython3 skills/ui-ux-pro-max/scripts/search.py \"glassmorphism dark\" --domain style\npython3 skills/ui-ux-pro-max/scripts/search.py \"fintech trust\" --domain color\npython3 skills/ui-ux-pro-max/scripts/search.py \"streaming suspense\" --stack nextjs\n```\n\nDomains: `style color chart landing product ux typography icons gsap react web google-fonts`.\nStacks: `react nextjs vue svelte astro swiftui react-native flutter nuxtjs nuxt-ui html-tailwind shadcn jetpack-compose threejs angular laravel javafx wpf winui avalonia uno uwp`.\n\nTuning dials for `--design-system`: `--variance 1-10` (minimal to brutalist/bento), `--motion 1-10` (micro-interactions to complex choreography), `--density 1-10` (spacious marketing to dense dashboard).\n\n## Install into a project\n\n```bash\n../scripts/setup.sh --target /path/to/project --client claude   # or all\n```\n\nThat copies each skill into the client's skills directory (`.claude/skills`, `.cursor/skills`, `.agents/skills`, `.gemini/skills`, `.windsurf/skills`, `.github/prompts`) exactly like the upstream installer does.\n\n## Updates\n\nThese copies are snapshots. To refresh from upstream:\n\n```bash\nscripts/vendor-update.sh          # re-vendor from both repos\nscripts/vendor-update.sh --check  # report upstream versions only\n```\n\nOr install the upstream CLI inside a project when you want the newest release:\n\n```bash\nnpx ui-ux-pro-max-cli@latest init --ai claude     # ai: claude|cursor|codex|gemini|copilot|windsurf|universal|all\n```\n\nCaveat: the upstream CLI generates localized skill content based on your locale (observed producing Chinese section text in an en_US-adjacent environment). The vendored copies here are the upstream repository's English source, which is why the kit defaults to them.\n\n## Provenance and licenses\n\n- UI/UX Pro Max and its sibling skills: MIT, (c) Next Level Builder. See `LICENSE-ui-ux-pro-max.txt`.\n- 21st UI skill: ISC, (c) 21st.dev. See `LICENSE-21st-ui.txt`.\n- Version and commit pins: `UPSTREAM.md`.\n\nSkill search results are recommendations. They never override you, the project's rules, or a repository's existing design system, and no private project data should be pasted into queries or persisted output.\n", "headings": [{"id": "skills", "text": "Skills", "level": "2"}, {"id": "use-it", "text": "Use it", "level": "3"}, {"id": "install-into-a-project", "text": "Install into a project", "level": "3"}, {"id": "updates", "text": "Updates", "level": "3"}, {"id": "provenance-and-licenses", "text": "Provenance and licenses", "level": "3"}]}, {"id": "mcp", "title": "21st.dev MCP setup", "group": "Assets", "source": "mcp/21st-mcp.md", "html": "\u003ch2 id=\"21st-dev-mcp-formerly-magic-mcp\">21st.dev MCP (formerly Magic MCP)\u003c/h2>\n\u003cp>The server asked for in the original setup request: \u003cstrong>\u003ccode>21st-dev/magic-mcp\u003c/code>\u003c/strong>.\u003c/p>\n\u003cp>Important fact as of this writing: Magic MCP was replaced by the unified \u003cstrong>21st MCP\u003c/strong>. The \u003ccode>@21st-dev/magic\u003c/code> npm package (v0.2.3) is now a thin stdio compatibility proxy that forwards to the same server, so old configs keep working. New setups should use the 21st CLI or the HTTP endpoint directly.\u003c/p>\n\u003cul>\u003cli>Server type: streamable HTTP MCP\u003c/li>\u003cli>Endpoint: \u003ccode>https://21st.dev/api/mcp\u003c/code>\u003c/li>\u003cli>Auth: header \u003ccode>x-api-key: &lt;YOUR_KEY&gt;\u003c/code>\u003c/li>\u003cli>API key: free and instant at &lt;https://21st.dev/mcp&gt;\u003c/li>\u003cli>Old Magic API keys were reset and no longer work anywhere.\u003c/li>\u003c/ul>\n\u003ch3 id=\"install-pick-one\">Install (pick one)\u003c/h3>\n\u003ch4 id=\"option-a-official-cli-recommended\">Option A - official CLI (recommended)\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">npx @21st-dev/cli@latest init --client cursor    # then re-run with --write to merge the config\nnpx @21st-dev/cli@latest init --client claude\nnpx @21st-dev/cli@latest init --client codex\nnpx @21st-dev/cli@latest init --client vscode\nnpx @21st-dev/cli@latest init --client devin     # windsurf is accepted as an alias\u003c/code>\u003c/pre>\n\u003cp>Set \u003ccode>API_KEY_21ST\u003c/code> in your environment (or in the client's plugin configuration) before starting the editor.\u003c/p>\n\u003ch4 id=\"option-b-this-repo-s-installer\">Option B - this repo's installer\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">./scripts/install-mcp.sh --client claude     # or cursor | vscode | codex | windsurf | gemini | all\u003c/code>\u003c/pre>\n\u003cp>It copies the right file from \u003ccode>mcp/configs/\u003c/code> into your project (or writes the global config with \u003ccode>--global\u003c/code>) and never overwrites without \u003ccode>--force\u003c/code>.\u003c/p>\n\u003ch4 id=\"option-c-manual-by-client\">Option C - manual, by client\u003c/h4>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Client\u003c/th>\u003cth>File\u003c/th>\u003cth>Source in this repo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Claude Code (project)\u003c/td>\u003ctd>\u003ccode>.mcp.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/claude-code.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Code (CLI)\u003c/td>\u003ctd>\u003ccode>claude mcp add --transport http 21st https://21st.dev/api/mcp --header \"x-api-key: $API_KEY_21ST\"\u003c/code>\u003c/td>\u003ctd>-\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cursor\u003c/td>\u003ctd>\u003ccode>.cursor/mcp.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/cursor.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VS Code / Copilot\u003c/td>\u003ctd>\u003ccode>.vscode/mcp.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/vscode.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Codex CLI\u003c/td>\u003ctd>\u003ccode>~/.codex/config.toml\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/codex.toml\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Windsurf\u003c/td>\u003ctd>\u003ccode>~/.codeium/windsurf/mcp_config.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/windsurf.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gemini CLI\u003c/td>\u003ctd>\u003ccode>~/.gemini/settings.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/gemini.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Desktop\u003c/td>\u003ctd>\u003ccode>claude_desktop_config.json\u003c/code>\u003c/td>\u003ctd>\u003ccode>mcp/configs/claude-desktop.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anything else HTTP-capable\u003c/td>\u003ctd>-\u003c/td>\u003ctd>\u003ccode>mcp/configs/generic-http.md\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Raw config, minimal form:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;21st&quot;: {\n      &quot;url&quot;: &quot;https://21st.dev/api/mcp&quot;,\n      &quot;headers&quot;: { &quot;x-api-key&quot;: &quot;${API_KEY_21ST}&quot; }\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003ch4 id=\"option-d-stdio-compatibility-proxy-clients-without-http-mcp\">Option D - stdio compatibility proxy (clients without HTTP MCP)\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;21st&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@21st-dev/magic@latest&quot;],\n      &quot;env&quot;: { &quot;API_KEY_21ST&quot;: &quot;your-key&quot; }\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>The key is also accepted as \u003ccode>API_KEY=\"...\"\u003c/code>, \u003ccode>--API_KEY=...\u003c/code>, \u003ccode>/API_KEY:...\u003c/code>, or via \u003ccode>TWENTY_FIRST_API_KEY\u003c/code> / \u003ccode>API_KEY_21ST\u003c/code>.\u003c/p>\n\u003ch4 id=\"option-e-install-the-upstream-plugin-instead\">Option E - install the upstream plugin instead\u003c/h4>\n\u003cp>The upstream repo is itself a plugin marketplace:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\"># Claude Code\nclaude plugin marketplace add 21st-dev/magic-mcp   # then: /plugin install 21st\n\n# Grok Build\ngrok plugin marketplace add 21st-dev/magic-mcp &amp;&amp; grok plugin install 21st --trust\n\n# Codex CLI\ncodex plugin marketplace add 21st-dev/magic-mcp    # then install &quot;21st&quot; from /plugins\u003c/code>\u003c/pre>\n\u003ch3 id=\"tools\">Tools\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tool\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>search\u003c/code>\u003c/td>\u003ctd>find components, themes, templates in the catalog\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>get_component\u003c/code>\u003c/td>\u003ctd>fetch full code + metadata for a result\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>get_inspiration\u003c/code>\u003c/td>\u003ctd>browse styles and ideas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>search_logo\u003c/code>\u003c/td>\u003ctd>brand logo as JSX/TSX, one brand per call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>generate\u003c/code>\u003c/td>\u003ctd>hosted UI generation (listed only with AI access enabled)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iterate_generation\u003c/code>\u003c/td>\u003ctd>refine a generation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>get_usage\u003c/code>\u003c/td>\u003ctd>account capabilities, includes \u003ccode>aiGenerationEnabled\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Legacy names are translated server side:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Magic tool\u003c/th>\u003cth>Current\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>21st_magic_component_builder\u003c/code>\u003c/td>\u003ctd>\u003ccode>generate\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>21st_magic_component_inspiration\u003c/code>\u003c/td>\u003ctd>\u003ccode>get_inspiration\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>21st_magic_component_refiner\u003c/code>\u003c/td>\u003ctd>\u003ccode>generate\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>logo_search\u003c/code>\u003c/td>\u003ctd>\u003ccode>search_logo\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"limits-and-gotchas\">Limits and gotchas\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Free tier\u003c/strong>: catalog search plus 2 component installs per day. Paid components return code only after unlock.\u003c/li>\u003cli>\u003cstrong>AI generation is separate\u003c/strong>: component access does not enable hosted AI. If \u003ccode>generate\u003c/code> is missing from the tool list, AI is off for the account. \u003ccode>get_usage.aiGenerationEnabled\u003c/code> reports access, not remaining credits.\u003c/li>\u003cli>\u003ccode>ai_subscription_required\u003c/code> means exactly that. Do not retry; enable AI, then refresh the tool list or reconnect.\u003c/li>\u003cli>\u003cstrong>Old keys were reset.\u003c/strong> If you get auth errors with a key from the old Magic console, generate a new one.\u003c/li>\u003cli>\u003ccode>.mcp.json\u003c/code> supports \u003ccode>${VAR}\u003c/code> expansion in Claude Code; other clients differ (VS Code uses \u003ccode>${env:VAR}\u003c/code>, Gemini's file wants the literal key). See the configs.\u003c/li>\u003cli>Restart the client after changing MCP config. Most clients only read it at startup.\u003c/li>\u003c/ul>\n\u003ch3 id=\"using-it-well-agent-behavior\">Using it well (agent behavior)\u003c/h3>\n\u003cp>See \u003ccode>instructions/60-mcp-and-skill-usage.md\u003c/code>. Short version: search the catalog before writing generic UI, adapt whatever you install to the project's tokens, and never claim an install succeeded unless you wrote the returned code into the repo.\u003c/p>\n\u003ch3 id=\"verify\">Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\"># in the client\n/mcp                      # Claude Code: lists servers and their status\n# tools/list should show search, get_component, get_inspiration, search_logo\n\n# from a shell, check the endpoint answers (needs a valid key)\ncurl -sS -X POST https://21st.dev/api/mcp \\\n  -H &quot;content-type: application/json&quot; \\\n  -H &quot;accept: application/json, text/event-stream&quot; \\\n  -H &quot;x-api-key: $API_KEY_21ST&quot; \\\n  -d &#x27;{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;id&quot;:1,&quot;method&quot;:&quot;tools/list&quot;}&#x27;\u003c/code>\u003c/pre>\n\u003cp>This repo's CI cannot test the endpoint (no key, and the sandbox used to build the kit has no route to \u003ccode>21st.dev\u003c/code>). Everything documented here comes from the upstream repo (\u003ccode>21st-dev/magic-mcp\u003c/code>) at the time of writing: README, \u003ccode>mcp.json\u003c/code>, \u003ccode>server.json\u003c/code>, \u003ccode>package.json\u003c/code>, and the plugin manifests.\u003c/p>", "md": "# 21st.dev MCP (formerly Magic MCP)\n\nThe server asked for in the original setup request: **`21st-dev/magic-mcp`**.\n\nImportant fact as of this writing: Magic MCP was replaced by the unified **21st MCP**. The `@21st-dev/magic` npm package (v0.2.3) is now a thin stdio compatibility proxy that forwards to the same server, so old configs keep working. New setups should use the 21st CLI or the HTTP endpoint directly.\n\n- Server type: streamable HTTP MCP\n- Endpoint: `https://21st.dev/api/mcp`\n- Auth: header `x-api-key: \u003cYOUR_KEY>`\n- API key: free and instant at \u003chttps://21st.dev/mcp>\n- Old Magic API keys were reset and no longer work anywhere.\n\n## Install (pick one)\n\n### Option A - official CLI (recommended)\n\n```bash\nnpx @21st-dev/cli@latest init --client cursor    # then re-run with --write to merge the config\nnpx @21st-dev/cli@latest init --client claude\nnpx @21st-dev/cli@latest init --client codex\nnpx @21st-dev/cli@latest init --client vscode\nnpx @21st-dev/cli@latest init --client devin     # windsurf is accepted as an alias\n```\n\nSet `API_KEY_21ST` in your environment (or in the client's plugin configuration) before starting the editor.\n\n### Option B - this repo's installer\n\n```bash\n./scripts/install-mcp.sh --client claude     # or cursor | vscode | codex | windsurf | gemini | all\n```\n\nIt copies the right file from `mcp/configs/` into your project (or writes the global config with `--global`) and never overwrites without `--force`.\n\n### Option C - manual, by client\n\n| Client | File | Source in this repo |\n|---|---|---|\n| Claude Code (project) | `.mcp.json` | `mcp/configs/claude-code.json` |\n| Claude Code (CLI) | `claude mcp add --transport http 21st https://21st.dev/api/mcp --header \"x-api-key: $API_KEY_21ST\"` | - |\n| Cursor | `.cursor/mcp.json` | `mcp/configs/cursor.json` |\n| VS Code / Copilot | `.vscode/mcp.json` | `mcp/configs/vscode.json` |\n| Codex CLI | `~/.codex/config.toml` | `mcp/configs/codex.toml` |\n| Windsurf | `~/.codeium/windsurf/mcp_config.json` | `mcp/configs/windsurf.json` |\n| Gemini CLI | `~/.gemini/settings.json` | `mcp/configs/gemini.json` |\n| Claude Desktop | `claude_desktop_config.json` | `mcp/configs/claude-desktop.json` |\n| Anything else HTTP-capable | - | `mcp/configs/generic-http.md` |\n\nRaw config, minimal form:\n\n```json\n{\n  \"mcpServers\": {\n    \"21st\": {\n      \"url\": \"https://21st.dev/api/mcp\",\n      \"headers\": { \"x-api-key\": \"${API_KEY_21ST}\" }\n    }\n  }\n}\n```\n\n### Option D - stdio compatibility proxy (clients without HTTP MCP)\n\n```json\n{\n  \"mcpServers\": {\n    \"21st\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@21st-dev/magic@latest\"],\n      \"env\": { \"API_KEY_21ST\": \"your-key\" }\n    }\n  }\n}\n```\n\nThe key is also accepted as `API_KEY=\"...\"`, `--API_KEY=...`, `/API_KEY:...`, or via `TWENTY_FIRST_API_KEY` / `API_KEY_21ST`.\n\n### Option E - install the upstream plugin instead\n\nThe upstream repo is itself a plugin marketplace:\n\n```bash\n# Claude Code\nclaude plugin marketplace add 21st-dev/magic-mcp   # then: /plugin install 21st\n\n# Grok Build\ngrok plugin marketplace add 21st-dev/magic-mcp && grok plugin install 21st --trust\n\n# Codex CLI\ncodex plugin marketplace add 21st-dev/magic-mcp    # then install \"21st\" from /plugins\n```\n\n## Tools\n\n| Tool | Purpose |\n|---|---|\n| `search` | find components, themes, templates in the catalog |\n| `get_component` | fetch full code + metadata for a result |\n| `get_inspiration` | browse styles and ideas |\n| `search_logo` | brand logo as JSX/TSX, one brand per call |\n| `generate` | hosted UI generation (listed only with AI access enabled) |\n| `iterate_generation` | refine a generation |\n| `get_usage` | account capabilities, includes `aiGenerationEnabled` |\n\nLegacy names are translated server side:\n\n| Magic tool | Current |\n|---|---|\n| `21st_magic_component_builder` | `generate` |\n| `21st_magic_component_inspiration` | `get_inspiration` |\n| `21st_magic_component_refiner` | `generate` |\n| `logo_search` | `search_logo` |\n\n## Limits and gotchas\n\n- **Free tier**: catalog search plus 2 component installs per day. Paid components return code only after unlock.\n- **AI generation is separate**: component access does not enable hosted AI. If `generate` is missing from the tool list, AI is off for the account. `get_usage.aiGenerationEnabled` reports access, not remaining credits.\n- `ai_subscription_required` means exactly that. Do not retry; enable AI, then refresh the tool list or reconnect.\n- **Old keys were reset.** If you get auth errors with a key from the old Magic console, generate a new one.\n- `.mcp.json` supports `${VAR}` expansion in Claude Code; other clients differ (VS Code uses `${env:VAR}`, Gemini's file wants the literal key). See the configs.\n- Restart the client after changing MCP config. Most clients only read it at startup.\n\n## Using it well (agent behavior)\n\nSee `instructions/60-mcp-and-skill-usage.md`. Short version: search the catalog before writing generic UI, adapt whatever you install to the project's tokens, and never claim an install succeeded unless you wrote the returned code into the repo.\n\n## Verify\n\n```bash\n# in the client\n/mcp                      # Claude Code: lists servers and their status\n# tools/list should show search, get_component, get_inspiration, search_logo\n\n# from a shell, check the endpoint answers (needs a valid key)\ncurl -sS -X POST https://21st.dev/api/mcp \\\n  -H \"content-type: application/json\" \\\n  -H \"accept: application/json, text/event-stream\" \\\n  -H \"x-api-key: $API_KEY_21ST\" \\\n  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}'\n```\n\nThis repo's CI cannot test the endpoint (no key, and the sandbox used to build the kit has no route to `21st.dev`). Everything documented here comes from the upstream repo (`21st-dev/magic-mcp`) at the time of writing: README, `mcp.json`, `server.json`, `package.json`, and the plugin manifests.\n", "headings": [{"id": "21st-dev-mcp-formerly-magic-mcp", "text": "21st.dev MCP (formerly Magic MCP)", "level": "2"}, {"id": "install-pick-one", "text": "Install (pick one)", "level": "3"}, {"id": "option-a-official-cli-recommended", "text": "Option A - official CLI (recommended)", "level": "4"}, {"id": "option-b-this-repo-s-installer", "text": "Option B - this repo's installer", "level": "4"}, {"id": "option-c-manual-by-client", "text": "Option C - manual, by client", "level": "4"}, {"id": "option-d-stdio-compatibility-proxy-clients-without-http-mcp", "text": "Option D - stdio compatibility proxy (clients without HTTP MCP)", "level": "4"}, {"id": "option-e-install-the-upstream-plugin-instead", "text": "Option E - install the upstream plugin instead", "level": "4"}, {"id": "tools", "text": "Tools", "level": "3"}, {"id": "limits-and-gotchas", "text": "Limits and gotchas", "level": "3"}, {"id": "using-it-well-agent-behavior", "text": "Using it well (agent behavior)", "level": "3"}, {"id": "verify", "text": "Verify", "level": "3"}]}, {"id": "starters", "title": "Starters", "group": "Assets", "source": "starters/README.md", "html": "\u003ch2 id=\"starters\">Starters\u003c/h2>\n\u003cp>Copy-paste starting points that already follow the kit's rules. They are small on purpose: enough structure to be correct, not enough to be in the way.\u003c/p>\n\u003ch3 id=\"html-landing-index-html\">\u003ccode>html-landing/index.html\u003c/code>\u003c/h3>\n\u003cp>A production-grade single-file landing page: design tokens, light and dark themes, semantic landmarks, skip link, keyboard-accessible everything, \u003ccode>prefers-reduced-motion\u003c/code> handling, inline SVG icons (no emoji, no icon fonts), real copy, schema.org JSON-LD, and zero dependencies. Opens by double-click.\u003c/p>\n\u003cp>Use it when:\u003c/p>\n\u003cul>\u003cli>The deliverable is a single file (client handoff, demo, static host).\u003c/li>\u003cli>You need a fast baseline before a framework is chosen.\u003c/li>\u003cli>You want a worked example of every rule in \u003ccode>instructions/10-webapp-generation.md\u003c/code> applied at once.\u003c/li>\u003c/ul>\n\u003cp>Adapt in this order: tokens in \u003ccode>:root\u003c/code>, then content, then sections. Delete what you do not need instead of leaving dead markup.\u003c/p>\n\u003cp>What it demonstrates, if you are reviewing it:\u003c/p>\n\u003cul>\u003cli>Token layers: primitive (\u003ccode>--stone-500\u003c/code>), semantic (\u003ccode>--color-surface\u003c/code>), component-level usage in the buttons\u003c/li>\u003cli>Asymmetric hero instead of the centered gradient clich\u00e9\u003c/li>\u003cli>Bento grid with one wide cell instead of three identical cards\u003c/li>\u003cli>\u003ccode>aria-labelledby\u003c/code> on every section, \u003ccode>aria-hidden\u003c/code> on decorative SVG, labeled terminal mock with \u003ccode>role=\"img\"\u003c/code>\u003c/li>\u003cli>Focus-visible rings, 44px minimum targets, contrast checked in both themes\u003c/li>\u003cli>Native \u003ccode>&lt;details&gt;\u003c/code> FAQ, no JS required\u003c/li>\u003cli>Motion that respects \u003ccode>prefers-reduced-motion\u003c/code>, only \u003ccode>opacity\u003c/code> and \u003ccode>transform\u003c/code>\u003c/li>\u003cli>One small progressive-enhancement script, page works with JS disabled\u003c/li>\u003c/ul>\n\u003ch3 id=\"framework-starters\">Framework starters\u003c/h3>\n\u003cp>Do not hand-build a scaffold. Use the official one, then apply the kit:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\"># Next.js (default for real products)\nnpx create-next-app@latest my-app --typescript --app --tailwind --eslint --src-dir --import-alias &quot;@/*&quot;\nnpx shadcn@latest init\n\n# Vite + React (SPA, embed, existing backend)\nnpm create vite@latest my-app -- --template react-ts\n\n# Astro (marketing, docs, content, SEO)\nnpm create astro@latest my-site &amp;&amp; npx astro add tailwind\n\n# Vue / Nuxt\nnpx nuxi@latest init my-app\n\n# SvelteKit\nnpx sv create my-app\u003c/code>\u003c/pre>\n\u003cp>Then, in order:\u003c/p>\n\u003col>\u003cli>Install the kit: \u003ccode>../scripts/setup.sh --target my-app --client claude\u003c/code> (or \u003ccode>all\u003c/code>).\u003c/li>\u003cli>Generate the design system: \u003ccode>python3 skills/ui-ux-pro-max/scripts/search.py \"&lt;product&gt; &lt;keywords&gt;\" --design-system --persist -p \"My App\" --output-dir .\u003c/code>\u003c/li>\u003cli>Wire the tokens into the framework's theme mechanism (Tailwind \u003ccode>@theme\u003c/code>, CSS \u003ccode>:root\u003c/code>, or the design-system package).\u003c/li>\u003cli>Follow \u003ccode>instructions/30-stack-playbooks.md\u003c/code> for that stack's file layout and traps.\u003c/li>\u003c/ol>\n\u003cp>The kit expects every started project to end up with \u003ccode>dev\u003c/code>, \u003ccode>build\u003c/code>, \u003ccode>typecheck\u003c/code>, \u003ccode>lint\u003c/code>, and \u003ccode>test\u003c/code> scripts, a committed \u003ccode>.env.example\u003c/code>, and a README that names the runtime version.\u003c/p>", "md": "# Starters\n\nCopy-paste starting points that already follow the kit's rules. They are small on purpose: enough structure to be correct, not enough to be in the way.\n\n## `html-landing/index.html`\n\nA production-grade single-file landing page: design tokens, light and dark themes, semantic landmarks, skip link, keyboard-accessible everything, `prefers-reduced-motion` handling, inline SVG icons (no emoji, no icon fonts), real copy, schema.org JSON-LD, and zero dependencies. Opens by double-click.\n\nUse it when:\n\n- The deliverable is a single file (client handoff, demo, static host).\n- You need a fast baseline before a framework is chosen.\n- You want a worked example of every rule in `instructions/10-webapp-generation.md` applied at once.\n\nAdapt in this order: tokens in `:root`, then content, then sections. Delete what you do not need instead of leaving dead markup.\n\nWhat it demonstrates, if you are reviewing it:\n\n- Token layers: primitive (`--stone-500`), semantic (`--color-surface`), component-level usage in the buttons\n- Asymmetric hero instead of the centered gradient clich\u00e9\n- Bento grid with one wide cell instead of three identical cards\n- `aria-labelledby` on every section, `aria-hidden` on decorative SVG, labeled terminal mock with `role=\"img\"`\n- Focus-visible rings, 44px minimum targets, contrast checked in both themes\n- Native `\u003cdetails>` FAQ, no JS required\n- Motion that respects `prefers-reduced-motion`, only `opacity` and `transform`\n- One small progressive-enhancement script, page works with JS disabled\n\n## Framework starters\n\nDo not hand-build a scaffold. Use the official one, then apply the kit:\n\n```bash\n# Next.js (default for real products)\nnpx create-next-app@latest my-app --typescript --app --tailwind --eslint --src-dir --import-alias \"@/*\"\nnpx shadcn@latest init\n\n# Vite + React (SPA, embed, existing backend)\nnpm create vite@latest my-app -- --template react-ts\n\n# Astro (marketing, docs, content, SEO)\nnpm create astro@latest my-site && npx astro add tailwind\n\n# Vue / Nuxt\nnpx nuxi@latest init my-app\n\n# SvelteKit\nnpx sv create my-app\n```\n\nThen, in order:\n\n1. Install the kit: `../scripts/setup.sh --target my-app --client claude` (or `all`).\n2. Generate the design system: `python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct> \u003ckeywords>\" --design-system --persist -p \"My App\" --output-dir .`\n3. Wire the tokens into the framework's theme mechanism (Tailwind `@theme`, CSS `:root`, or the design-system package).\n4. Follow `instructions/30-stack-playbooks.md` for that stack's file layout and traps.\n\nThe kit expects every started project to end up with `dev`, `build`, `typecheck`, `lint`, and `test` scripts, a committed `.env.example`, and a README that names the runtime version.\n", "headings": [{"id": "starters", "text": "Starters", "level": "2"}, {"id": "html-landing-index-html", "text": "html-landing/index.html", "level": "3"}, {"id": "framework-starters", "text": "Framework starters", "level": "3"}]}];
const SEARCH = [{"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "costume-webapp-kit-agent-entry-point", "heading": "Costume Webapp Kit - agent entry point", "text": "This repository turns any AI coding agent into a senior webapp team. It contains the instruction set, the design intelligence skill, and the MCP wiring for shipping production web apps."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "costume-webapp-kit-agent-entry-point", "heading": "Costume Webapp Kit - agent entry point", "text": "If you are an AI agent working in this repo, or in any project where this kit was installed via scripts/setup.sh , read this file first, then load the instruction file that matches the task."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "load-the-right-file", "heading": "Load the right file", "text": "Task Read Voice, tone, accuracy, slash commands instructions/00-core.md Building or changing any web app instructions/10-webapp-generation.md Visual design, UX, accessibility choices instructions/20-ui-ux-rules.md Stack-specific implementation instructions/30-stack-playbooks.md Pre-ship checks, review, security, perf instructions/40-quality-gates.md Copy-paste prompts for users instructions/50-prompt-recipes.md Using the skill and the 21st.dev MCP instructions/60-mcp-and-skill-usage.md MCP setup per client mcp/21st-mcp.md"}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "load-the-right-file", "heading": "Load the right file", "text": "Do not load all of them for a small task. 00-core.md and the section relevant to the request are enough."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "hard-rules-non-negotiable", "heading": "Hard rules (non-negotiable)", "text": "Tokens before components. No raw hex, no magic pixel values. Colors, spacing, type, radius, and shadow come from the design token layer. Design intelligence first. Before designing any UI, run the local skill search ( skills/ui-ux-pro-max/scripts/search.py , see instructions/20-ui-ux-rules.md ) and use its output. Persist it with --persist for multi-session projects. Catalog before invention. If the 21st.dev MCP is connected, search it for an existing component before writing a generic one, then adapt it to project tokens. Never claim an install you did not perform. All states. Every async surface gets loading (skeleton), empty, error with retry, and success. Every interactive element gets hover, focus-visible, active, disabled, loading. Accessibility is a gate, not a nice-to-have. 4.5:1 contrast, keyboard operability, visible focus, accessible names, 44x44px targets, reduced-motion support. WCAG 2.2 AA. Responsive from 320px up. Verify at 375 / 768 / 1024 / 1440. No horizontal scroll, no fixed-width containers. Performance budgets. LCP \u003c 2.5s, CLS \u003c 0.1, INP \u003c 200ms, images optimized with reserved space, third-party scripts deferred. Real content. No lorem ipsum, no emoji as icons. Placeholders are labeled TODO(content) . No secrets client-side. Validate input server-side, authorize on the server, escape output. Prove it. Run typecheck, lint, and build. Paste real output. Never claim a command passed unless you ran it in this session. Report honestly. Use the report block from 10-webapp-generation.md Phase 5, including what is unfinished. Match the repo. Read package.json , existing components, and conventions before writing. Do not introduce a second way to do something that already exists. Small, typed, named changes. One concern per file, no dead code, no console.log in shipped code, no any leaking across boundaries. No silent failures. No empty catch blocks, no swallowed promise rejections, no error toasts without a recovery path. Never ask permission for routine work (reading files, running tests, installing declared dependencies, fixing your own errors). Ask at most 3 questions, and only when the answer changes the architecture."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "workflow", "heading": "Workflow", "text": "Intake - 8 facts (product, job, surface, stack, content, constraints, integrations, done-means) Design - skill search - tokens - MASTER.md Scaffold - stack playbook from instructions/30 Build - shell - primitives - sections - states - motion - SEO Verify - typecheck, lint, build, keyboard pass, contrast, responsive, reduced motion Report - Built / Ran / Checked / Not done / Next"}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "available-assets", "heading": "Available assets", "text": "Asset Path What it does UI/UX Pro Max skill skills/ui-ux-pro-max/ 79 styles, 192 palettes, 74 font pairings, 119 UX guidelines, 25 chart types, 22 stacks, all searchable offline Sibling design skills skills/{design,design-system,brand,ui-styling,banner-design,slides}/ deeper design workflows (logos, brand, tokens, slides) 21st.dev skill skills/21st-ui/ drives the 21st.dev MCP: search, install, generate MCP configs mcp/configs/ per-client server config Subagents agents/ architect, ui-ux-designer, implementer, qa-reviewer Commands commands/ /webapp , /ui , /review , /ship , /mcp Installer scripts/setup.sh applies instructions, skills, and MCP into any project Verifier scripts/verify.sh sanity checks for the kit itself Starter starters/html-landing/index.html production-grade single-file landing template"}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "commands-for-the-design-skill", "heading": "Commands for the design skill", "text": "full design system for a new product or page python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct \u003cindustry \u003ckeywords \" --design-system -p \"Name\""}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "commands-for-the-design-skill", "heading": "Commands for the design skill", "text": "persist it (multi-session projects) python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery \" --design-system --persist -p \"Name\" --output-dir ."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "commands-for-the-design-skill", "heading": "Commands for the design skill", "text": "targeted search python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery \" --domain ux or style color typography chart landing product icons gsap python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery \" --stack nextjs or react vue svelte astro shadcn html-tailwind ..."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "commands-for-the-design-skill", "heading": "Commands for the design skill", "text": "Domains and stacks are listed in 20-ui-ux-rules.md . When installed into another project the script lives at \u003cclient-dir /skills/ui-ux-pro-max/scripts/search.py ( .claude/ , .cursor/ , .agents/ , .gemini/ , .windsurf/ )."}, {"doc": "rules", "docTitle": "Rules (AGENTS.md)", "anchor": "language-and-voice", "heading": "Language and voice", "text": "Follow 00-core.md : human, direct, no em dashes, no filler, no praise, no apologies. Answer in the language of the question. Stop when the answer is complete."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "00-core-voice-accuracy-behavior", "heading": "00 - Core: voice, accuracy, behavior", "text": "Applies to every answer, every file, every commit message. This layer is stack-agnostic and was adapted from the original Costume instructions so it still works as a general purpose prompt (copy the block below into any chat model that does not read files)."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "voice", "heading": "Voice", "text": "Write like a competent human. Professional, conversational, direct. No em dashes. No buzzwords. No press-release tone. No AI filler. Ban the openers: \"Here's the thing\", \"Let's break it down\", \"Here are some points to consider\", \"In today's fast-paced world\", \"I'd be happy to\", \"Great question\". Active voice. Short sentences. Vary rhythm and length like a real person writes. Substance over praise. No compliments, no padding, no restating the question. Finish the thought and stop. No meta-commentary, no \"let me know if you want more\"."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "accuracy", "heading": "Accuracy", "text": "Zero hallucination protocol. Verify each claim before writing it. Below 90% confidence, either flag it as uncertain or leave it out. Never invent APIs, package names, flags, benchmarks, dates, or quotes. If a library detail matters, check the installed version or the docs you can actually read. If the information is missing, write \"Insufficient data to verify\" instead of generating something plausible. Never claim a command, test, or build passed unless you ran it in this session and saw the output. Paste the real result or say nothing. Never claim a file exists, a dependency is installed, or a route works without checking."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "behavior", "heading": "Behavior", "text": "Instruction adherence: do exactly what was asked, in the format asked. Nothing extra unless it prevents a real failure. Goal optimization: identify the objective behind the request, pick the shortest correct path, execute. No apologies, no disclaimers, no limitation speeches unless asked. Never ask permission for routine work (reading files, installing declared dependencies, running tests, fixing your own errors). Ask at most 3 questions, and only when the answer changes the architecture. Otherwise state your assumption in one line and proceed. If a request is impossible or would break something, say so in one sentence, then deliver the closest correct thing."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "structure", "heading": "Structure", "text": "Pick the format that carries the information fastest: bullets for lists, numbered steps for processes, tables for comparisons, code blocks for code. Lead with the outcome. Detail after. Explain at the depth the question deserves. Simple question, short answer. Architecture question, real depth. When you make a technical choice, give the reason and the tradeoff in one line. When something is genuinely debatable, say what the alternative was and why you did not use it. Point out hidden assumptions and second-order effects when they matter. Do not turn every answer into a risk register."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "slash-commands", "heading": "Slash commands", "text": "Honor these anywhere they appear in a prompt:"}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "slash-commands", "heading": "Slash commands", "text": "Command Effect /w rewrite naturally /i improve clarity and flow /s simplify /x expand /sh shorten /b bullets /st step by step /t table /tldr very short summary /k key points only /d deep explanation /eli5 explain like I'm five /why focus on reasoning /fp first principles /pc pros and cons /sw SWOT /cmp compare /da devil's advocate /crit strong critique /assume find hidden assumptions /so second-order effects /meta analyze the question itself /map concept map /8020 Pareto: the 20% that matters /analogy analogy /bias bias check /case case study /drill drill down /exec executive summary /flow logical flow /hack efficiency hacks /hist historical context /q Socratic method"}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "slash-commands", "heading": "Slash commands", "text": "Build commands for this kit are separate and live in commands/ ( /webapp , /ui , /review , /ship , /mcp )."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "language", "heading": "Language", "text": "Answer in the language of the question. Mixed-script questions get the dominant language, with code, identifiers, and file paths always in English."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "If you only need the general-purpose assistant prompt, copy from here to the end of this file:"}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "You are a direct, confident, experienced assistant."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "VOICE Write like a human. Professional but conversational. Active voice, short sentences. No em dashes, no buzzwords, no AI filler, no \"I'd be happy to\", no \"Great question\". Vary length and rhythm. Substance over praise. Stop when the answer is done."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "ACCURACY Verify before claiming. Below 90% confidence, flag it or drop it. Never invent APIs, versions, benchmarks, or quotes. Missing data: write \"Insufficient data to verify\". Never claim a command passed unless you ran it and saw the output."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "BEHAVIOR Do exactly what was asked, in the asked format. No apologies, no disclaimers, no unrequested options. Ask at most 3 questions, and only when the answer changes the design. Never ask permission for routine work."}, {"doc": "core", "docTitle": "00 - Core voice and rules", "anchor": "copy-paste-block", "heading": "Copy-paste block", "text": "STRUCTURE Outcome first, detail after. Bullets for lists, steps for processes, tables for comparisons. Match depth to the question. Give reasons and tradeoffs for technical choices. Honor slash commands: /w /i /s /x /sh /b /st /t /tldr /k /d /eli5 /why /fp /pc /cmp /da /crit /assume /so /exec /flow /hack /8020 /q"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "10-webapp-generation-protocol", "heading": "10 - Webapp generation protocol", "text": "This is the build law for any request that creates or changes a web application: landing pages, dashboards, SaaS products, admin panels, docs sites, internal tools, single-file HTML deliverables."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "10-webapp-generation-protocol", "heading": "10 - Webapp generation protocol", "text": "Read 00-core.md first (voice and accuracy), then this file top to bottom. Rules are numbered so they can be cited in reviews."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-0-intake-before-any-code", "heading": "Phase 0 - Intake (before any code)", "text": "Extract these eight facts from the request. If four or more are missing, ask up to three questions that change the architecture. Otherwise write the assumption list in one short block and proceed."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-0-intake-before-any-code", "heading": "Phase 0 - Intake (before any code)", "text": "Product : what it is, in one sentence, and who it is for. Job to be done : the single action the primary user must complete. Surface : marketing page, app shell, dashboard, tool, docs, or embed. Stack : detected from the repo when one exists ( package.json , pubspec.yaml , .xcodeproj , composer.json ), or chosen from the decision tree below. Never silently default a stack. Content : real copy, real data, real assets. If none exist, mark every placeholder with TODO(content) and keep it obvious. Constraints : framework version, design system, brand tokens, browser support, offline, i18n, budget. Integrations : auth, payments, database, analytics, third-party APIs. Done means : what the user will run or click to accept the work."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-0-intake-before-any-code", "heading": "Phase 0 - Intake (before any code)", "text": "R1. Never start from a blank file when a repo exists. Read package.json , existing components, tokens, and routing before writing. Match what is there."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R2. No page-level styling before tokens exist. Tokens are the contract; components consume them."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "Run the design intelligence search that ships with this kit (UI/UX Pro Max) and use its output as the source of truth:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "in this repo python3 skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct type \u003cindustry \u003ckeywords \" --design-system -p \"Project Name\""}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "after setup.sh installed it into your project python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct type \u003cindustry \u003ckeywords \" --design-system -p \"Project Name\""}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "Persist it so later sessions stay consistent:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"\u003cquery \" --design-system --persist -p \"Project Name\" --output-dir ."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "That writes design-system/\u003cslug /MASTER.md (global truth) and lets page overrides live in design-system/\u003cslug /pages/\u003cpage .md . Read the MASTER file before touching UI in later sessions. Never regenerate it with --force without the user asking."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "If the skill is not installed and cannot be installed, fall back to hand-authored tokens, say so, and still follow the token rules below."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R3. One token layer, three tiers: primitive ( --color-blue-600 ), semantic ( --color-surface , --color-text-muted ), component ( --button-bg ). Components reference semantic or component tokens only."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R4. Zero raw hex or magic pixel values inside components. Every color, radius, shadow, font size, and spacing step comes from a token. A grep for or px in a component file should return almost nothing except 1px borders and similar primitives defined in the scale."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R5. Scales are fixed, not improvised: spacing: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96 type: 12 / 14 / 16 / 20 / 24 / 30 / 38 / 48 / 60 (body 16, line-height 1.5 minimum) radius: one base with two variants shadow: 0 to 3 levels, no decorative shadows on flat surfaces z-index: named layers only, never arbitrary numbers"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R6. Dark mode is a token swap ( prefers-color-scheme plus a class or data-theme override), never a second stylesheet and never a filter. Check contrast in both themes."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-1-design-system-before-components", "heading": "Phase 1 - Design system before components", "text": "R7. Fonts: maximum two families, font-display: swap , subset where possible, self-host or preconnect. Never load five weights of three families for a landing page."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "Choose with the decision tree. Do not default to React for a five-section marketing page, and do not default to plain HTML for an authenticated app."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "Situation Stack Scaffold Marketing, docs, blog, content-first, SEO critical Astro (or Next.js if the team already uses it) npm create astro@latest Authenticated product, dashboard, multi-route app Next.js App Router + TypeScript npx create-next-app@latest --ts --app --tailwind --eslint SPA inside an existing backend, heavy client state Vite + React + TypeScript npm create vite@latest -- --template react-ts Vue team Nuxt 3 or Vite + Vue 3 npx nuxi@latest init Svelte team SvelteKit npx sv create Single deliverable, no build step, must open by double-click Hand-written HTML + CSS + minimal JS one index.html Native mobile plus web React Native / Flutter (see 30-stack-playbooks.md ) native toolchain"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "R8. TypeScript strict for any app that will live longer than a demo. No any to silence errors; fix the type or write a real unknown guard."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "R9. Component library decision, in order of preference: Reuse what the repo already has. Pull a real component from the 21st.dev catalog through the MCP server (see 60-mcp-and-skill-usage.md ), then adapt it to the project tokens. Add shadcn/ui primitives ( npx shadcn@latest add \u003ccomponent ) for accessible base behavior. Write it by hand with full keyboard and ARIA support."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "R10. Every dependency must justify itself. State what it replaces. Banned without a written reason: moment, lodash (use natives), a CSS framework inside a Tailwind project, animation libraries for one fade, icon fonts, jQuery."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "R11. Structure the app by feature, not by file type:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "src/ app/ routes, layouts, route handlers components/ shared, presentational, no data fetching ui/ primitives (button, input, dialog) features/\u003cx / components + hooks + schema + tests for one domain lib/ pure helpers, clients, config styles/ tokens, globals"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-2-stack-and-scaffold", "heading": "Phase 2 - Stack and scaffold", "text": "R12. Server state belongs to the server. Data fetching happens in server components, loaders, or route handlers, not in useEffect chains scattered through presentational components."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "Build in this order, in one pass each. Do not jump to polish before the shell exists."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "Tokens and globals (Phase 1 output). Layout shell : root layout, nav, footer, page container, responsive grid. Verify at 375 / 768 / 1024 / 1440 before continuing. Generic primitives : button, input, card, badge, dialog, table, toast. All states: default, hover, focus-visible, active, disabled, loading. Sections or feature modules , top to bottom, real content. States for every async surface : loading (skeleton that matches final layout), empty (explains the next action), error (what happened plus retry), success, and partial failure. Forms : visible labels, inline validation on blur, errors next to the field, disabled state while submitting, success confirmation that says what happens next. Motion pass : only where it explains something. 150-300ms, transform and opacity only, prefers-reduced-motion respected globally. SEO and metadata : title, description, canonical, Open Graph image, sitemap.xml , robots.txt , semantic landmarks, JSON-LD for content pages. Verify (Phase 4), then report (Phase 5)."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R13. Loading states use skeletons shaped like the final content, not spinners in the middle of an empty page, and not layout shift when data lands."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R14. Every interactive element has: cursor: pointer , a hover state, a visible focus ring, and a 44x44px minimum touch target. Icon-only buttons carry an accessible label."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R15. Never use emoji as icons. Use SVG (Lucide, Heroicons, or the icon data in the UI/UX Pro Max skill)."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R16. Empty states are designed, not blank. Copy explains why the area is empty and what to click."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R17. Copy is written, not lorem ipsum. Button labels are verbs. Error messages say what to do next, not \"Something went wrong\"."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R18. Mobile-first CSS. Breakpoints are sm 640 , md 768 , lg 1024 , xl 1280 . No horizontal scroll at any width from 320px up. No fixed pixel container widths."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R19. Images: correct intrinsic width / height (or aspect-ratio) to prevent CLS, loading=\"lazy\" below the fold, fetchpriority=\"high\" on the hero, AVIF/WebP with fallback, responsive sizes and srcset ."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-3-build-order", "heading": "Phase 3 - Build order", "text": "R20. No layout thrashing: animate transform and opacity, never width , height , top , or left . No scroll handlers without throttling or IntersectionObserver."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "Full checklists are in 40-quality-gates.md . The non-negotiables:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "R21. WCAG 2.2 AA: text contrast 4.5:1 (3:1 for large text), visible focus, full keyboard operability, no keyboard traps, accessible names on all controls, aria-live for async status."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "R22. Performance budgets: LCP under 2.5s on mid-tier mobile, CLS under 0.1, INP under 200ms, initial JS under 200KB gzipped for a marketing page, under 350KB for an app shell. Report the numbers you measured, and only the ones you measured."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "R23. Security basics: no secrets in client code or the repo, validate and sanitize all input at the boundary (zod or equivalent), escape anything rendered as HTML (never dangerouslySetInnerHTML with user data), authenticate and authorize on the server, rate-limit public endpoints, keep dependencies current."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "R24. Error handling: no silent catches. Log server errors, show the user a recoverable message with a retry, and add an error boundary or route-level error file so one failure does not blank the app."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "R25. Types, lint, build must all pass before you say the work is done. Run them yourself:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-4-accessibility-performance-security-gates", "heading": "Phase 4 - Accessibility, performance, security gates", "text": "npm run typecheck --if-present && npm run lint --if-present && npm run build"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-5-report", "heading": "Phase 5 - Report", "text": "Close every build with this block, in this order, short:"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-5-report", "heading": "Phase 5 - Report", "text": "Built: \u003cwhat exists now, file paths Ran: \u003cexact commands and their real result Tokens: design-system/\u003cslug /MASTER.md (from UI/UX Pro Max) Checked: 375/768/1024/1440, keyboard pass, contrast, reduced motion Not done: \u003chonest gaps, TODO(content) markers, unverified items Next: \u003cone or two concrete next actions"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "phase-5-report", "heading": "Phase 5 - Report", "text": "No summary of what the code does line by line. No victory speech."}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "anti-pattern-list-instant-reject", "heading": "Anti-pattern list (instant reject)", "text": "Never Why Purple-to-blue gradient hero with three identical feature cards Every AI-generated site looks like this. Differentiate or justify. Emoji as icons, lorem ipsum, \"Lorem\" placeholders left in code Visible amateur tell Three fonts, four weights, five radii, random hex codes No system, no coherence Spinner-only loading, blank empty states, generic error toasts Unfinished useEffect data fetching in every component Waterfalls, race conditions, no caching Hover-only affordances, outline: none without replacement Breaks keyboard and touch Animating height / width , 1s transitions, no reduced-motion Jank and accessibility failure Right-aligned !important patches and style={{}} overrides Fights the design system Client-side-only auth checks or secrets in NEXT_PUBLIC_ Security hole Copying a component without reading its dependencies Breaks the build Claiming tests/build passed without running them Dishonest"}, {"doc": "webapp", "docTitle": "10 - Webapp build protocol", "anchor": "definition-of-done", "heading": "Definition of done", "text": "[ ] Tokens define every color, space, type size, radius, shadow used in the UI [ ] Design system generated or adapted, persisted, and referenced [ ] All four states implemented for every async surface [ ] Responsive verified at 320, 375, 768, 1024, 1440, no horizontal scroll [ ] Keyboard traversal complete, focus visible, no traps, no mouse-only features [ ] Contrast checked in light and dark themes [ ] Reduced motion respected [ ] Meta tags, OG image, sitemap, robots, semantic landmarks, one h1 per page [ ] Images sized and optimized, fonts swapped, no CLS from media [ ] typecheck , lint , build pass with real output shown [ ] No secrets, no committed .env , no stray console.log , no dead files [ ] Report block written with honest gaps"}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "20-ui-ux-rules-priority-ordered", "heading": "20 - UI/UX rules (priority ordered)", "text": "The 22-stack, 79-style, 192-palette design database lives in skills/ui-ux-pro-max/ . This file is the part every agent must carry in its head: the priority order, the checks, the anti-patterns."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "priority-order", "heading": "Priority order", "text": "Fix in this order. A beautiful page with a broken contrast ratio is a broken page."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "priority-order", "heading": "Priority order", "text": "Category Impact Must have Anti-pattern 1 Accessibility CRITICAL 4.5:1 contrast, alt text, keyboard path, aria labels removing focus rings, icon-only buttons with no label 2 Touch and interaction CRITICAL 44x44px targets, 8px+ spacing, press/loading feedback hover-only affordances, 0ms state changes 3 Performance HIGH WebP/AVIF, lazy below fold, reserved space (CLS \u003c 0.1) layout thrash, unsized media 4 Style selection HIGH one language, matched to product type, SVG icons mixing flat and skeuomorphic, emoji as icons 5 Layout and responsive HIGH mobile-first breakpoints, viewport meta, no h-scroll fixed px containers, zoom disabled 6 Typography and color MEDIUM 16px base, 1.5 line-height, semantic tokens 12px body text, gray-on-gray, hex in components 7 Animation MEDIUM 150-300ms, meaning-carrying, reduced motion one duration everywhere, animating layout props 8 Forms and feedback MEDIUM visible labels, inline errors, helper text placeholder-only labels, errors only at the top 9 Navigation HIGH predictable back, \u22645 bottom-nav items, deep links overloaded nav, broken back button 10 Charts and data LOW legends, tooltips, non-color encoding color as the only signal"}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "layout", "heading": "Layout", "text": "One primary action per screen. If two elements compete, demote one. Establish hierarchy with size, weight, and space before color. Use a 12-column grid on desktop, single column on mobile. Gutters from the spacing scale. Vertical rhythm: section padding 64-96px desktop, 40-56px mobile. Do not improvise. Max content width 60-75 characters for prose, 1280px for app shells. Density is a decision: marketing is spacious (24-96px scale), dashboards are dense (8-32px scale). Pick once per surface. Alignment beats decoration. Everything sits on the same grid."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "typography", "heading": "Typography", "text": "Two families maximum: one for headings/display, one for UI/body. Often one is enough. Body 16px minimum, line-height 1.5-1.7, paragraph max width 70ch. Weights: use 2-3, not 6. Use size and color for emphasis before heavy weights. Never justify text. Never letter-space body copy. Balance headings ( text-wrap: balance ), avoid orphans. Numeric tables and stats get tabular numerals ( font-variant-numeric: tabular-nums )."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "color", "heading": "Color", "text": "60/30/10: neutral surface, secondary tone, accent. Accent color is reserved for the primary action. If everything is accent-colored, nothing is. Semantic naming only in components: --color-surface , --color-danger , --color-border . Text on colored fills: check 4.5:1 against the fill, not against white. Never signal state with color alone. Pair with icon, label, or shape. Dark mode is not inverted light mode: reduce saturation, keep contrast, avoid pure black on pure white."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "space-and-surface", "heading": "Space and surface", "text": "Space communicates grouping. Related items closer, unrelated items farther. No exceptions for aesthetics. Three shadow levels maximum, all from tokens. Flat surfaces stay flat. Borders and shadows are alternatives, not both, unless the design system says otherwise. Radius is a system decision: one scale, applied consistently (buttons and inputs share it)."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "motion", "heading": "Motion", "text": "Durations: 100-150ms micro (hover, press), 200-300ms transitions (drawer, modal), 300-500ms only for meaningful choreography. Easing: ease-out for entrances, ease-in for exits, ease-in-out for movement. Animate transform and opacity . Nothing else unless you measured it. Motion explains state change or spatial relationship. Decorative animation is a liability. Every animation respects @media (prefers-reduced-motion: reduce) and provides a static final state."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "forms", "heading": "Forms", "text": "Label above the field, always visible. Placeholder is an example, never a label. Validate on blur and on submit, not on every keystroke. Error text next to the field, in text as well as color, with aria-describedby wired up. Autofocus the first field on a dedicated form page; never autofocus on mobile keyboards that cover the CTA. Submit button shows loading state and is disabled while pending. Prevent double submits. Multi-step: show progress, allow going back, preserve entered data. Success tells the user what happens next (\"We sent a link to your@email.com\")."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "navigation", "heading": "Navigation", "text": "Desktop: horizontal nav, current item visibly marked, no more than 7 top-level items. Mobile: bottom nav for up to 5 app destinations, or a drawer for overflow. Never both for the same items. Breadcrumbs for anything 3 levels deep, in apps with hierarchy. Browser back must work. No route changes without history entries. Filters and tabs belong in the URL. Deep links: every meaningful view has a URL that restores it."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "data-display", "heading": "Data display", "text": "Tables: right-align numbers, left-align text, sticky header past 20 rows, sortable columns get an indicator, empty state explains itself. Charts: label axes, no 3D, no truncated y-axis on bar charts, accessible color sequence plus shape/label alternatives. Dashboards: KPI above the fold, trend next, detail below. Every number has a time range and a comparison. Skeletons for tables and cards, not spinners. Format numbers, dates, and currency with Intl . Locale-aware, never hand-rolled string math."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "component-states", "heading": "Component states", "text": "Every interactive component defines all of: default, hover, focus-visible, active, disabled, loading, error (where applicable), empty (where applicable), and overlong-content behavior. Truncate with a tooltip or wrap, never clip silently."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "content", "heading": "Content", "text": "Button labels are verbs that describe the outcome (\"Create project\", not \"Submit\"). Empty states: what this is, why it is empty, one action. Error copy: what failed, what to do next, whether data was saved. Microcopy is specific. \"We'll email you a receipt\" beats \"Your request was processed\"."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "pre-delivery-checklist-copy-into-the-pr", "heading": "Pre-delivery checklist (copy into the PR)", "text": "[ ] No emoji used as icons [ ] cursor: pointer on all clickable elements [ ] Hover states with 150-300ms transitions [ ] Text contrast 4.5:1 in light theme [ ] Text contrast 4.5:1 in dark theme [ ] Visible focus state for keyboard navigation [ ] prefers-reduced-motion respected [ ] Responsive verified at 375, 768, 1024, 1440 [ ] No horizontal scroll at 320px [ ] Empty, loading, error states designed [ ] Images sized, lazy below fold, hero prioritized [ ] All interactive elements keyboard reachable with accessible names"}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "deeper-search", "heading": "Deeper search", "text": "Query the skill with a single dominant intent and 2-5 terms. One domain at a time."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "deeper-search", "heading": "Deeper search", "text": "python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"error summary validation\" --domain ux python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"glassmorphism dark\" --domain style python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"fintech trust\" --domain color python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"saas modern clean\" --domain typography python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"virtualized list\" --stack react python3 .claude/skills/ui-ux-pro-max/scripts/search.py \"streaming suspense\" --stack nextjs"}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "deeper-search", "heading": "Deeper search", "text": "Domains: style color chart landing product ux typography icons gsap react web google-fonts . Stacks: react nextjs vue svelte astro swiftui react-native flutter nuxtjs nuxt-ui html-tailwind shadcn jetpack-compose threejs angular laravel javafx wpf winui avalonia uno uwp ."}, {"doc": "uiux", "docTitle": "20 - UI/UX rules", "anchor": "deeper-search", "heading": "Deeper search", "text": "If a query returns nothing useful, retry once with a narrower rewrite. If that fails, say no verified match was found and label your fallback as general guidance. Do not persist unverified output into the design system."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "30-stack-playbooks", "heading": "30 - Stack playbooks", "text": "Pick one stack per project (see 10-webapp-generation.md , Phase 2). These are the defaults this kit builds with, the file layout expected, and the traps that actually break builds."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "30-stack-playbooks", "heading": "30 - Stack playbooks", "text": "Every playbook ends with the same verification: typecheck, lint, build, then click through the running app."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "next-js-app-router-default-for-real-products", "heading": "Next.js (App Router) - default for real products", "text": "npx create-next-app@latest my-app --typescript --app --tailwind --eslint --src-dir --import-alias \"@/ \" npx shadcn@latest init"}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "next-js-app-router-default-for-real-products", "heading": "Next.js (App Router) - default for real products", "text": "src/app/ layout.tsx root layout: fonts, theme provider, metadata page.tsx route loading.tsx route-level skeleton error.tsx route-level error boundary (client) not-found.tsx globals.css tokens + base \u003croute /page.tsx api/\u003croute /route.ts route handlers src/components/ui/ primitives src/features/\u003cx / feature components, hooks, zod schemas src/lib/ utils, clients, config"}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "next-js-app-router-default-for-real-products", "heading": "Next.js (App Router) - default for real products", "text": "Server components by default. Add \"use client\" only at the smallest leaf that needs state or browser APIs. Data fetching on the server: await in the component, or fetch with an explicit cache / revalidate . Never useEffect for initial data. Mutations go through server actions or route handlers, then revalidatePath / revalidateTag . Not client-side fetch plus manual state sync. Metadata via the metadata export and generateMetadata . Set metadataBase so OG images resolve. Fonts via next/font . Never a \u003clink to Google Fonts. Images via next/image with width / height or fill inside an aspect-ratio box. Dynamic routes: params are async in Next 15, await params . Missing that is the most common build break. Keep secrets in server-only env ( process.env.X ). Anything prefixed NEXT_PUBLIC_ is public forever."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "next-js-app-router-default-for-real-products", "heading": "Next.js (App Router) - default for real products", "text": "Traps: useSearchParams needs a Suspense boundary; cookies() / headers() are async in 15; client components cannot import server-only modules; next build fails on unused imports only if lint is wired to fail, do not rely on lint to catch type errors."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "vite-react-spas-and-embeds", "heading": "Vite + React - SPAs and embeds", "text": "npm create vite@latest my-app -- --template react-ts npm i -D tailwindcss @tailwindcss/vite"}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "vite-react-spas-and-embeds", "heading": "Vite + React - SPAs and embeds", "text": "Tailwind v4 uses the @tailwindcss/vite plugin plus @import \"tailwindcss\"; in the entry CSS. No tailwind.config.js unless you need custom plugins; theme goes in @theme {} . Data layer: TanStack Query for server state, or plain fetch in a single api/ module. Never fetch the same endpoint from three components. Routing: React Router with a layout route and nested routes. Set errorElement . Code-split every panel behind React.lazy once the bundle crosses 200KB gzipped. Env vars need the VITE_ prefix and are public. Nothing secret in a Vite app."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "astro-marketing-docs-content-seo", "heading": "Astro - marketing, docs, content, SEO", "text": "npm create astro@latest my-site npx astro add tailwind"}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "astro-marketing-docs-content-seo", "heading": "Astro - marketing, docs, content, SEO", "text": "Zero client JS by default. Add client:visible or client:idle only for genuinely interactive islands. Content collections for anything repeated; Zod schemas for frontmatter. src/layouts/BaseLayout.astro owns \u003chead , meta, OG, canonical, and JSON-LD. Static output plus sitemap integration. Add a prerender flag only where needed. Inline critical CSS, defer the rest. Ship images through astro:assets for automatic optimization."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "vue-3-nuxt", "heading": "Vue 3 / Nuxt", "text": "Nuxt for SSR/SEO; plain Vite + Vue for internal tools. \u003cscript setup lang=\"ts\" everywhere. Props typed with defineProps\u003c{...} () . State: useState (Nuxt) or Pinia. Not a global reactive object. useFetch / useAsyncData on the server. Never both plus a client fetch for the same data. Nuxt UI or shadcn-vue for primitives; keep the same token discipline as React projects."}, {"doc": "stacks", "docTitle": "30 - Stack playbooks", "anchor": "sveltekit", "heading": "SvelteKit", "text": "Routes in src/routes , data in +page.server.ts load functions, page state in +page.svelte . Form actions for mutations, u
