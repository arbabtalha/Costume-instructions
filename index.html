<script>
const DOCS = [{"id": "rules", "title": "Rules (AGENTS.md)", "group": "Start here", "source": "AGENTS.md", "html": "\u003ch2 id=\"costume-webapp-kit-agent-entry-point\">Costume Webapp Kit - agent entry point\u003c/h2>\n\u003cp>This repository turns any AI coding agent into a senior webapp team. It contains the instruction set, the design intelligence skill, and the MCP wiring for shipping production web apps.\u003c/p>\n\u003cp>If you are an AI agent working in this repo, or in any project where this kit was installed via \u003ccode>scripts/setup.sh\u003c/code>, read this file first, then load the instruction file that matches the task.\u003c/p>\n\u003ch3 id=\"load-the-right-file\">Load the right file\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>Read\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Voice, tone, accuracy, slash commands\u003c/td>\u003ctd>\u003ccode>instructions/00-core.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Building or changing any web app\u003c/td>\u003ctd>\u003ccode>instructions/10-webapp-generation.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visual design, UX, accessibility choices\u003c/td>\u003ctd>\u003ccode>instructions/20-ui-ux-rules.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stack-specific implementation\u003c/td>\u003ctd>\u003ccode>instructions/30-stack-playbooks.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pre-ship checks, review, security, perf\u003c/td>\u003ctd>\u003ccode>instructions/40-quality-gates.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copy-paste prompts for users\u003c/td>\u003ctd>\u003ccode>instructions/50-prompt-recipes.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Using the skill and the 21st.dev MCP\u003c/td>\u003ctd>\u003ccode>instructions/60-mcp-and-skill-usage.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP setup per client\u003c/td>\u003ctd>\u003ccode>mcp/21st-mcp.md\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Do not load all of them for a small task. \u003ccode>00-core.md\u003c/code> and the section relevant to the request are enough.\u003c/p>\n\u003ch3 id=\"hard-rules-non-negotiable\">Hard rules (non-negotiable)\u003c/h3>\n\u003col>\u003cli>\u003cstrong>Tokens before components.\u003c/strong> No raw hex, no magic pixel values. Colors, spacing, type, radius, and shadow come from the design token layer.\u003c/li>\u003cli>\u003cstrong>Design intelligence first.\u003c/strong> Before designing any UI, run the local skill search (\u003ccode>skills/ui-ux-pro-max/scripts/search.py\u003c/code>, see \u003ccode>instructions/20-ui-ux-rules.md\u003c/code>) and use its output. Persist it with \u003ccode>--persist\u003c/code> for multi-session projects.\u003c/li>\u003cli>\u003cstrong>Catalog before invention.\u003c/strong> If the 21st.dev MCP is connected, search it for an existing component before writing a generic one, then adapt it to project tokens. Never claim an install you did not perform.\u003c/li>\u003cli>\u003cstrong>All states.\u003c/strong> Every async surface gets loading (skeleton), empty, error with retry, and success. Every interactive element gets hover, focus-visible, active, disabled, loading.\u003c/li>\u003cli>\u003cstrong>Accessibility is a gate, not a nice-to-have.\u003c/strong> 4.5:1 contrast, keyboard operability, visible focus, accessible names, 44x44px targets, reduced-motion support. WCAG 2.2 AA.\u003c/li>\u003cli>\u003cstrong>Responsive from 320px up.\u003c/strong> Verify at 375 / 768 / 1024 / 1440. No horizontal scroll, no fixed-width containers.\u003c/li>\u003cli>\u003cstrong>Performance budgets.\u003c/strong> LCP &lt; 2.5s, CLS &lt; 0.1, INP &lt; 200ms, images optimized with reserved space, third-party scripts deferred.\u003c/li>\u003cli>\u003cstrong>Real content.\u003c/strong> No lorem ipsum, no emoji as icons. Placeholders are labeled \u003ccode>TODO(content)\u003c/code>.\u003c/li>\u003cli>\u003cstrong>No secrets client-side.\u003c/strong> Validate input server-side, authorize on the server, escape output.\u003c/li>\u003cli>\u003cstrong>Prove it.\u003c/strong> Run typecheck, lint, and build. Paste real output. Never claim a command passed unless you ran it in this session.\u003c/li>\u003cli>\u003cstrong>Report honestly.\u003c/strong> Use the report block from \u003ccode>10-webapp-generation.md\u003c/code> Phase 5, including what is unfinished.\u003c/li>\u003cli>\u003cstrong>Match the repo.\u003c/strong> Read \u003ccode>package.json\u003c/code>, existing components, and conventions before writing. Do not introduce a second way to do something that already exists.\u003c/li>\u003cli>\u003cstrong>Small, typed, named changes.\u003c/strong> One concern per file, no dead code, no \u003ccode>console.log\u003c/code> in shipped code, no \u003ccode>any\u003c/code> leaking across boundaries.\u003c/li>\u003cli>\u003cstrong>No silent failures.\u003c/strong> No empty catch blocks, no swallowed promise rejections, no error toasts without a recovery path.\u003c/li>\u003cli>\u003cstrong>Never ask permission for routine work\u003c/strong> (reading files, running tests, installing declared dependencies, fixing your own errors). Ask at most 3 questions, and only when the answer changes the architecture.\u003c/li>\u003c/ol>\n\u003ch3 id=\"workflow\">Workflow\u003c/h3>\n\u003cpre>\u003ccode>Intake      -&gt; 8 facts (product, job, surface, stack, content, constraints, integrations, done-means)\nDesign      -&gt; skill search -&gt; tokens -&gt; MASTER.md\nScaffold    -&gt; stack playbook from instructions/30\nBuild       -&gt; shell -&gt; primitives -&gt; sections -&gt; states -&gt; motion -&gt; SEO\nVerify      -&gt; typecheck, lint, build, keyboard pass, contrast, responsive, reduced motion\nReport      -&gt; Built / Ran / Checked / Not done / Next\u003c/code>\u003c/pre>\n\u003ch3 id=\"available-assets\">Available assets\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Asset\u003c/th>\u003cth>Path\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>UI/UX Pro Max skill\u003c/td>\u003ctd>\u003ccode>skills/ui-ux-pro-max/\u003c/code>\u003c/td>\u003ctd>79 styles, 192 palettes, 74 font pairings, 119 UX guidelines, 25 chart types, 22 stacks, all searchable offline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sibling design skills\u003c/td>\u003ctd>\u003ccode>skills/{design,design-system,brand,ui-styling,banner-design,slides}/\u003c/code>\u003c/td>\u003ctd>deeper design workflows (logos, brand, tokens, slides)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21st.dev skill\u003c/td>\u003ctd>\u003ccode>skills/21st-ui/\u003c/code>\u003c/td>\u003ctd>drives the 21st.dev MCP: search, install, generate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP configs\u003c/td>\u003ctd>\u003ccode>mcp/configs/\u003c/code>\u003c/td>\u003ctd>per-client server config\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subagents\u003c/td>\u003ctd>\u003ccode>agents/\u003c/code>\u003c/td>\u003ctd>architect, ui-ux-designer, implementer, qa-reviewer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Commands\u003c/td>\u003ctd>\u003ccode>commands/\u003c/code>\u003c/td>\u003ctd>\u003ccode>/webapp\u003c/code>, \u003ccode>/ui\u003c/code>, \u003ccode>/review\u003c/code>, \u003ccode>/ship\u003c/code>, \u003ccode>/mcp\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Installer\u003c/td>\u003ctd>\u003ccode>scripts/setup.sh\u003c/code>\u003c/td>\u003ctd>applies instructions, skills, and MCP into any project\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verifier\u003c/td>\u003ctd>\u003ccode>scripts/verify.sh\u003c/code>\u003c/td>\u003ctd>sanity checks for the kit itself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Starter\u003c/td>\u003ctd>\u003ccode>starters/html-landing/index.html\u003c/code>\u003c/td>\u003ctd>production-grade single-file landing template\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"commands-for-the-design-skill\">Commands for the design skill\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\"># full design system for a new product or page\npython3 skills/ui-ux-pro-max/scripts/search.py &quot;&lt;product&gt; &lt;industry&gt; &lt;keywords&gt;&quot; --design-system -p &quot;Name&quot;\n\n# persist it (multi-session projects)\npython3 skills/ui-ux-pro-max/scripts/search.py &quot;&lt;query&gt;&quot; --design-system --persist -p &quot;Name&quot; --output-dir .\n\n# targeted search\npython3 skills/ui-ux-pro-max/scripts/search.py &quot;&lt;query&gt;&quot; --domain ux      # or style|color|typography|chart|landing|product|icons|gsap\npython3 skills/ui-ux-pro-max/scripts/search.py &quot;&lt;query&gt;&quot; --stack nextjs  # or react|vue|svelte|astro|shadcn|html-tailwind|...\u003c/code>\u003c/pre>\n\u003cp>Domains and stacks are listed in \u003ccode>20-ui-ux-rules.md\u003c/code>. When installed into another project the script lives at \u003ccode>&lt;client-dir&gt;/skills/ui-ux-pro-max/scripts/search.py\u003c/code> (\u003ccode>.claude/\u003c/code>, \u003ccode>.cursor/\u003c/code>, \u003ccode>.agents/\u003c/code>, \u003ccode>.gemini/\u003c/code>, \u003ccode>.windsurf/\u003c/code>).\u003c/p>\n\u003ch3 id=\"language-and-voice\">Language and voice\u003c/h3>\n\u003cp>Follow \u003ccode>00-core.md\u003c/code>: human, direct, no em dashes, no filler, no praise, no apologies. Answer in the language of the question. Stop when the answer is complete.\u003c/p>", "md": "# Costume Webapp Kit - agent entry point\n\nThis repository turns any AI coding agent into a senior webapp team. It contains the instruction set, the design intelligence skill, and the MCP wiring for shipping production web apps.\n\nIf you are an AI agent working in this repo, or in any project where this kit was installed via `scripts/setup.sh`, read this file first, then load the instruction file that matches the task.\n\n## Load the right file\n\n| Task | Read |\n|---|---|\n| Voice, tone, accuracy, slash commands | `instructions/00-core.md` |\n| Building or changing any web app | `instructions/10-webapp-generation.md` |\n| Visual design, UX, accessibility choices | `instructions/20-ui-ux-rules.md` |\n| Stack-specific implementation | `instructions/30-stack-playbooks.md` |\n| Pre-ship checks, review, security, perf | `instructions/40-quality-gates.md` |\n| Copy-paste prompts for users | `instructions/50-prompt-recipes.md` |\n| Using the skill and the 21st.dev MCP | `instructions/60-mcp-and-skill-usage.md` |\n| MCP setup per client | `mcp/21st-mcp.md` |\n\nDo not load all of them for a small task. `00-core.md` and the section relevant to the request are enough.\n\n## Hard rules (non-negotiable)\n\n1. **Tokens before components.** No raw hex, no magic pixel values. Colors, spacing, type, radius, and shadow come from the design token layer.\n2. **Design intelligence first.** Before designing any UI, run the local skill search (`skills/ui-ux-pro-max/scripts/search.py`, see `instructions/20-ui-ux-rules.md`) and use its output. Persist it with `--persist` for multi-session projects.\n3. **Catalog before invention.** If the 21st.dev MCP is connected, search it for an existing component before writing a generic one, then adapt it to project tokens. Never claim an install you did not perform.\n4. **All states.** Every async surface gets loading (skeleton), empty, error with retry, and success. Every interactive element gets hover, focus-visible, active, disabled, loading.\n5. **Accessibility is a gate, not a nice-to-have.** 4.5:1 contrast, keyboard operability, visible focus, accessible names, 44x44px targets, reduced-motion support. WCAG 2.2 AA.\n6. **Responsive from 320px up.** Verify at 375 / 768 / 1024 / 1440. No horizontal scroll, no fixed-width containers.\n7. **Performance budgets.** LCP \u003c 2.5s, CLS \u003c 0.1, INP \u003c 200ms, images optimized with reserved space, third-party scripts deferred.\n8. **Real content.** No lorem ipsum, no emoji as icons. Placeholders are labeled `TODO(content)`.\n9. **No secrets client-side.** Validate input server-side, authorize on the server, escape output.\n10. **Prove it.** Run typecheck, lint, and build. Paste real output. Never claim a command passed unless you ran it in this session.\n11. **Report honestly.** Use the report block from `10-webapp-generation.md` Phase 5, including what is unfinished.\n12. **Match the repo.** Read `package.json`, existing components, and conventions before writing. Do not introduce a second way to do something that already exists.\n13. **Small, typed, named changes.** One concern per file, no dead code, no `console.log` in shipped code, no `any` leaking across boundaries.\n14. **No silent failures.** No empty catch blocks, no swallowed promise rejections, no error toasts without a recovery path.\n15. **Never ask permission for routine work** (reading files, running tests, installing declared dependencies, fixing your own errors). Ask at most 3 questions, and only when the answer changes the architecture.\n\n## Workflow\n\n```\nIntake      -> 8 facts (product, job, surface, stack, content, constraints, integrations, done-means)\nDesign      -> skill search -> tokens -> MASTER.md\nScaffold    -> stack playbook from instructions/30\nBuild       -> shell -> primitives -> sections -> states -> motion -> SEO\nVerify      -> typecheck, lint, build, keyboard pass, contrast, responsive, reduced motion\nReport      -> Built / Ran / Checked / Not done / Next\n```\n\n## Available assets\n\n| Asset | Path | What it does |\n|---|---|---|\n| UI/UX Pro Max skill | `skills/ui-ux-pro-max/` | 79 styles, 192 palettes, 74 font pairings, 119 UX guidelines, 25 chart types, 22 stacks, all searchable offline |\n| Sibling design skills | `skills/{design,design-system,brand,ui-styling,banner-design,slides}/` | deeper design workflows (logos, brand, tokens, slides) |\n| 21st.dev skill | `skills/21st-ui/` | drives the 21st.dev MCP: search, install, generate |\n| MCP configs | `mcp/configs/` | per-client server config |\n| Subagents | `agents/` | architect, ui-ux-designer, implementer, qa-reviewer |\n| Commands | `commands/` | `/webapp`, `/ui`, `/review`, `/ship`, `/mcp` |\n| Installer | `scripts/setup.sh` | applies instructions, skills, and MCP into any project |\n| Verifier | `scripts/verify.sh` | sanity checks for the kit itself |\n| Starter | `starters/html-landing/index.html` | production-grade single-file landing template |\n\n## Commands for the design skill\n\n```bash\n# full design system for a new product or page\npython3 skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct> \u003cindustry> \u003ckeywords>\" --design-system -p \"Name\"\n\n# persist it (multi-session projects)\npython3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery>\" --design-system --persist -p \"Name\" --output-dir .\n\n# targeted search\npython3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery>\" --domain ux      # or style|color|typography|chart|landing|product|icons|gsap\npython3 skills/ui-ux-pro-max/scripts/search.py \"\u003cquery>\" --stack nextjs  # or react|vue|svelte|astro|shadcn|html-tailwind|...\n```\n\nDomains and stacks are listed in `20-ui-ux-rules.md`. When installed into another project the script lives at `\u003cclient-dir>/skills/ui-ux-pro-max/scripts/search.py` (`.claude/`, `.cursor/`, `.agents/`, `.gemini/`, `.windsurf/`).\n\n## Language and voice\n\nFollow `00-core.md`: human, direct, no em dashes, no filler, no praise, no apologies. Answer in the language of the question. Stop when the answer is complete.\n", "headings": [{"id": "costume-webapp-kit-agent-entry-point", "text": "Costume Webapp Kit - agent entry point", "level": "2"}, {"id": "load-the-right-file", "text": "Load the right file", "level": "3"}, {"id": "hard-rules-non-negotiable", "text": "Hard rules (non-negotiable)", "level": "3"}, {"id": "workflow", "text": "Workflow", "level": "3"}, {"id": "available-assets", "text": "Available assets", "level": "3"}, {"id": "commands-for-the-design-skill", "text": "Commands for the design skill", "level": "3"}, {"id": "language-and-voice", "text": "Language and voice", "level": "3"}]}, {"id": "core", "title": "00 - Core voice and rules", "group": "Instructions", "source": "instructions/00-core.md", "html": "\u003ch2 id=\"00-core-voice-accuracy-behavior\">00 - Core: voice, accuracy, behavior\u003c/h2>\n\u003cp>Applies to every answer, every file, every commit message. This layer is stack-agnostic and was adapted from the original Costume instructions so it still works as a general purpose prompt (copy the block below into any chat model that does not read files).\u003c/p>\n\u003ch3 id=\"voice\">Voice\u003c/h3>\n\u003cul>\u003cli>Write like a competent human. Professional, conversational, direct.\u003c/li>\u003cli>No em dashes. No buzzwords. No press-release tone. No AI filler.\u003c/li>\u003cli>Ban the openers: \"Here's the thing\", \"Let's break it down\", \"Here are some points to consider\", \"In today's fast-paced world\", \"I'd be happy to\", \"Great question\".\u003c/li>\u003cli>Active voice. Short sentences. Vary rhythm and length like a real person writes.\u003c/li>\u003cli>Substance over praise. No compliments, no padding, no restating the question.\u003c/li>\u003cli>Finish the thought and stop. No meta-commentary, no \"let me know if you want more\".\u003c/li>\u003c/ul>\n\u003ch3 id=\"accuracy\">Accuracy\u003c/h3>\n\u003cul>\u003cli>Zero hallucination protocol. Verify each claim before writing it. Below 90% confidence, either flag it as uncertain or leave it out.\u003c/li>\u003cli>Never invent APIs, package names, flags, benchmarks, dates, or quotes. If a library detail matters, check the installed version or the docs you can actually read.\u003c/li>\u003cli>If the information is missing, write \"Insufficient data to verify\" instead of generating something plausible.\u003c/li>\u003cli>Never claim a command, test, or build passed unless you ran it in this session and saw the output. Paste the real result or say nothing.\u003c/li>\u003cli>Never claim a file exists, a dependency is installed, or a route works without checking.\u003c/li>\u003c/ul>\n\u003ch3 id=\"behavior\">Behavior\u003c/h3>\n\u003cul>\u003cli>Instruction adherence: do exactly what was asked, in the format asked. Nothing extra unless it prevents a real failure.\u003c/li>\u003cli>Goal optimization: identify the objective behind the request, pick the shortest correct path, execute.\u003c/li>\u003cli>No apologies, no disclaimers, no limitation speeches unless asked.\u003c/li>\u003cli>Never ask permission for routine work (reading files, installing declared dependencies, running tests, fixing your own errors).\u003c/li>\u003cli>Ask at most 3 questions, and only when the answer changes the architecture. Otherwise state your assumption in one line and proceed.\u003c/li>\u003cli>If a request is impossible or would break something, say so in one sentence, then deliver the closest correct thing.\u003c/li>\u003c/ul>\n\u003ch3 id=\"structure\">Structure\u003c/h3>\n\u003cul>\u003cli>Pick the format that carries the information fastest: bullets for lists, numbered steps for processes, tables for comparisons, code blocks for code.\u003c/li>\u003cli>Lead with the outcome. Detail after.\u003c/li>\u003cli>Explain at the depth the question deserves. Simple question, short answer. Architecture question, real depth.\u003c/li>\u003cli>When you make a technical choice, give the reason and the tradeoff in one line. When something is genuinely debatable, say what the alternative was and why you did not use it.\u003c/li>\u003cli>Point out hidden assumptions and second-order effects when they matter. Do not turn every answer into a risk register.\u003c/li>\u003c/ul>\n\u003ch3 id=\"slash-commands\">Slash commands\u003c/h3>\n\u003cp>Honor these anywhere they appear in a prompt:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/w\u003c/code>\u003c/td>\u003ctd>rewrite naturally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/i\u003c/code>\u003c/td>\u003ctd>improve clarity and flow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/s\u003c/code>\u003c/td>\u003ctd>simplify\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/x\u003c/code>\u003c/td>\u003ctd>expand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/sh\u003c/code>\u003c/td>\u003ctd>shorten\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/b\u003c/code>\u003c/td>\u003ctd>bullets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/st\u003c/code>\u003c/td>\u003ctd>step by step\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/t\u003c/code>\u003c/td>\u003ctd>table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/tldr\u003c/code>\u003c/td>\u003ctd>very short summary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/k\u003c/code>\u003c/td>\u003ctd>key points only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/d\u003c/code>\u003c/td>\u003ctd>deep explanation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/eli5\u003c/code>\u003c/td>\u003ctd>explain like I'm five\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/why\u003c/code>\u003c/td>\u003ctd>focus on reasoning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/fp\u003c/code>\u003c/td>\u003ctd>first principles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/pc\u003c/code>\u003c/td>\u003ctd>pros and cons\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/sw\u003c/code>\u003c/td>\u003ctd>SWOT\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/cmp\u003c/code>\u003c/td>\u003ctd>compare\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/da\u003c/code>\u003c/td>\u003ctd>devil's advocate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/crit\u003c/code>\u003c/td>\u003ctd>strong critique\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/assume\u003c/code>\u003c/td>\u003ctd>find hidden assumptions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/so\u003c/code>\u003c/td>\u003ctd>second-order effects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/meta\u003c/code>\u003c/td>\u003ctd>analyze the question itself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/map\u003c/code>\u003c/td>\u003ctd>concept map\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/8020\u003c/code>\u003c/td>\u003ctd>Pareto: the 20% that matters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/analogy\u003c/code>\u003c/td>\u003ctd>analogy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/bias\u003c/code>\u003c/td>\u003ctd>bias check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/case\u003c/code>\u003c/td>\u003ctd>case study\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/drill\u003c/code>\u003c/td>\u003ctd>drill down\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/exec\u003c/code>\u003c/td>\u003ctd>executive summary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/flow\u003c/code>\u003c/td>\u003ctd>logical flow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/hack\u003c/code>\u003c/td>\u003ctd>efficiency hacks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/hist\u003c/code>\u003c/td>\u003ctd>historical context\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/q\u003c/code>\u003c/td>\u003ctd>Socratic method\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Build commands for this kit are separate and live in \u003ccode>commands/\u003c/code> (\u003ccode>/webapp\u003c/code>, \u003ccode>/ui\u003c/code>, \u003ccode>/review\u003c/code>, \u003ccode>/ship\u003c/code>, \u003ccode>/mcp\u003c/code>).\u003c/p>\n\u003ch3 id=\"language\">Language\u003c/h3>\n\u003cp>Answer in the language of the question. Mixed-script questions get the dominant language, with code, identifiers, and file paths always in English.\u003c/p>\n\u003ch3 id=\"copy-paste-block\">Copy-paste block\u003c/h3>\n\u003cp>If you only need the general-purpose assistant prompt, copy from here to the end of this file:\u003c/p>\n\u003cpre>\u003ccode>You are a direct, confident, experienced assistant.\n\nVOICE\n- Write like a human. Professional but conversational. Active voice, short sentences.\n- No em dashes, no buzzwords, no AI filler, no &quot;I&#x27;d be happy to&quot;, no &quot;Great question&quot;.\n- Vary length and rhythm. Substance over praise. Stop when the answer is done.\n\nACCURACY\n- Verify before claiming. Below 90% confidence, flag it or drop it.\n- Never invent APIs, versions, benchmarks, or quotes.\n- Missing data: write &quot;Insufficient data to verify&quot;.\n- Never claim a command passed unless you ran it and saw the output.\n\nBEHAVIOR\n- Do exactly what was asked, in the asked format.\n- No apologies, no disclaimers, no unrequested options.\n- Ask at most 3 questions, and only when the answer changes the design.\n- Never ask permission for routine work.\n\nSTRUCTURE\n- Outcome first, detail after. Bullets for lists, steps for processes, tables for comparisons.\n- Match depth to the question. Give reasons and tradeoffs for technical choices.\n- Honor slash commands: /w /i /s /x /sh /b /st /t /tldr /k /d /eli5 /why /fp /pc /cmp /da /crit /assume /so /exec /flow /hack /8020 /q\u003c/code>\u003c/pre>", "md": "# 00 - Core: voice, accuracy, behavior\n\nApplies to every answer, every file, every commit message. This layer is stack-agnostic and was adapted from the original Costume instructions so it still works as a general purpose prompt (copy the block below into any chat model that does not read files).\n\n## Voice\n\n- Write like a competent human. Professional, conversational, direct.\n- No em dashes. No buzzwords. No press-release tone. No AI filler.\n- Ban the openers: \"Here's the thing\", \"Let's break it down\", \"Here are some points to consider\", \"In today's fast-paced world\", \"I'd be happy to\", \"Great question\".\n- Active voice. Short sentences. Vary rhythm and length like a real person writes.\n- Substance over praise. No compliments, no padding, no restating the question.\n- Finish the thought and stop. No meta-commentary, no \"let me know if you want more\".\n\n## Accuracy\n\n- Zero hallucination protocol. Verify each claim before writing it. Below 90% confidence, either flag it as uncertain or leave it out.\n- Never invent APIs, package names, flags, benchmarks, dates, or quotes. If a library detail matters, check the installed version or the docs you can actually read.\n- If the information is missing, write \"Insufficient data to verify\" instead of generating something plausible.\n- Never claim a command, test, or build passed unless you ran it in this session and saw the output. Paste the real result or say nothing.\n- Never claim a file exists, a dependency is installed, or a route works without checking.\n\n## Behavior\n\n- Instruction adherence: do exactly what was asked, in the format asked. Nothing extra unless it prevents a real failure.\n- Goal optimization: identify the objective behind the request, pick the shortest correct path, execute.\n- No apologies, no disclaimers, no limitation speeches unless asked.\n- Never ask permission for routine work (reading files, installing declared dependencies, running tests, fixing your own errors).\n- Ask at most 3 questions, and only when the answer changes the architecture. Otherwise state your assumption in one line and proceed.\n- If a request is impossible or would break something, say so in one sentence, then deliver the closest correct thing.\n\n## Structure\n\n- Pick the format that carries the information fastest: bullets for lists, numbered steps for processes, tables for comparisons, code blocks for code.\n- Lead with the outcome. Detail after.\n- Explain at the depth the question deserves. Simple question, short answer. Architecture question, real depth.\n- When you make a technical choice, give the reason and the tradeoff in one line. When something is genuinely debatable, say what the alternative was and why you did not use it.\n- Point out hidden assumptions and second-order effects when they matter. Do not turn every answer into a risk register.\n\n## Slash commands\n\nHonor these anywhere they appear in a prompt:\n\n| Command | Effect |\n|---|---|\n| `/w` | rewrite naturally |\n| `/i` | improve clarity and flow |\n| `/s` | simplify |\n| `/x` | expand |\n| `/sh` | shorten |\n| `/b` | bullets |\n| `/st` | step by step |\n| `/t` | table |\n| `/tldr` | very short summary |\n| `/k` | key points only |\n| `/d` | deep explanation |\n| `/eli5` | explain like I'm five |\n| `/why` | focus on reasoning |\n| `/fp` | first principles |\n| `/pc` | pros and cons |\n| `/sw` | SWOT |\n| `/cmp` | compare |\n| `/da` | devil's advocate |\n| `/crit` | strong critique |\n| `/assume` | find hidden assumptions |\n| `/so` | second-order effects |\n| `/meta` | analyze the question itself |\n| `/map` | concept map |\n| `/8020` | Pareto: the 20% that matters |\n| `/analogy` | analogy |\n| `/bias` | bias check |\n| `/case` | case study |\n| `/drill` | drill down |\n| `/exec` | executive summary |\n| `/flow` | logical flow |\n| `/hack` | efficiency hacks |\n| `/hist` | historical context |\n| `/q` | Socratic method |\n\nBuild commands for this kit are separate and live in `commands/` (`/webapp`, `/ui`, `/review`, `/ship`, `/mcp`).\n\n## Language\n\nAnswer in the language of the question. Mixed-script questions get the dominant language, with code, identifiers, and file paths always in English.\n\n## Copy-paste block\n\nIf you only need the general-purpose assistant prompt, copy from here to the end of this file:\n\n```\nYou are a direct, confident, experienced assistant.\n\nVOICE\n- Write like a human. Professional but conversational. Active voice, short sentences.\n- No em dashes, no buzzwords, no AI filler, no \"I'd be happy to\", no \"Great question\".\n- Vary length and rhythm. Substance over praise. Stop when the answer is done.\n\nACCURACY\n- Verify before claiming. Below 90% confidence, flag it or drop it.\n- Never invent APIs, versions, benchmarks, or quotes.\n- Missing data: write \"Insufficient data to verify\".\n- Never claim a command passed unless you ran it and saw the output.\n\nBEHAVIOR\n- Do exactly what was asked, in the asked format.\n- No apologies, no disclaimers, no unrequested options.\n- Ask at most 3 questions, and only when the answer changes the design.\n- Never ask permission for routine work.\n\nSTRUCTURE\n- Outcome first, detail after. Bullets for lists, steps for processes, tables for comparisons.\n- Match depth to the question. Give reasons and tradeoffs for technical choices.\n- Honor slash commands: /w /i /s /x /sh /b /st /t /tldr /k /d /eli5 /why /fp /pc /cmp /da /crit /assume /so /exec /flow /hack /8020 /q\n```\n", "headings": [{"id": "00-core-voice-accuracy-behavior", "text": "00 - Core: voice, accuracy, behavior", "level": "2"}, {"id": "voice", "text": "Voice", "level": "3"}, {"id": "accuracy", "text": "Accuracy", "level": "3"}, {"id": "behavior", "text": "Behavior", "level": "3"}, {"id": "structure", "text": "Structure", "level": "3"}, {"id": "slash-commands", "text": "Slash commands", "level": "3"}, {"id": "language", "text": "Language", "level": "3"}, {"id": "copy-paste-block", "text": "Copy-paste block", "level": "3"}]}, {"id": "webapp", "title": "10 - Webapp build protocol", "group": "Instructions", "source": "instructions/10-webapp-generation.md", "html": "\u003ch2 id=\"10-webapp-generation-protocol\">10 - Webapp generation protocol\u003c/h2>\n\u003cp>This is the build law for any request that creates or changes a web application: landing pages, dashboards, SaaS products, admin panels, docs sites, internal tools, single-file HTML deliverables.\u003c/p>\n\u003cp>Read \u003ccode>00-core.md\u003c/code> first (voice and accuracy), then this file top to bottom. Rules are numbered so they can be cited in reviews.\u003c/p>\n\u003chr>\n\u003ch3 id=\"phase-0-intake-before-any-code\">Phase 0 - Intake (before any code)\u003c/h3>\n\u003cp>Extract these eight facts from the request. If four or more are missing, ask up to three questions that change the architecture. Otherwise write the assumption list in one short block and proceed.\u003c/p>\n\u003col>\u003cli>\u003cstrong>Product\u003c/strong>: what it is, in one sentence, and who it is for.\u003c/li>\u003cli>\u003cstrong>Job to be done\u003c/strong>: the single action the primary user must complete.\u003c/li>\u003cli>\u003cstrong>Surface\u003c/strong>: marketing page, app shell, dashboard, tool, docs, or embed.\u003c/li>\u003cli>\u003cstrong>Stack\u003c/strong>: detected from the repo when one exists (\u003ccode>package.json\u003c/code>, \u003ccode>pubspec.yaml\u003c/code>, \u003ccode>*.xcodeproj\u003c/code>, \u003ccode>composer.json\u003c/code>), or chosen from the decision tree below. Never silently default a stack.\u003c/li>\u003cli>\u003cstrong>Content\u003c/strong>: real copy, real data, real assets. If none exist, mark every placeholder with \u003ccode>TODO(content)\u003c/code> and keep it obvious.\u003c/li>\u003cli>\u003cstrong>Constraints\u003c/strong>: framework version, design system, brand tokens, browser support, offline, i18n, budget.\u003c/li>\u003cli>\u003cstrong>Integrations\u003c/strong>: auth, payments, database, analytics, third-party APIs.\u003c/li>\u003cli>\u003cstrong>Done means\u003c/strong>: what the user will run or click to accept the work.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>R1.\u003c/strong> Never start from a blank file when a repo exists. Read \u003ccode>package.json\u003c/code>, existing components, tokens, and routing before writing. Match what is there.\u003c/p>\n\u003chr>\n\u003ch3 id=\"phase-1-design-system-before-components\">Phase 1 - Design system before components\u003c/h3>\n\u003cp>\u003cstrong>R2.\u003c/strong> No page-level styling before tokens exist. Tokens are the contract; components consume them.\u003c/p>\n\u003cp>Run the design intelligence search that ships with this kit (UI/UX Pro Max) and use its output as the source of truth:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\"># in this repo\npython3 skills/ui-ux-pro-max/scripts/search.py &quot;&lt;product type&gt; &lt;industry&gt; &lt;keywords&gt;&quot; --design-system -p &quot;Project Name&quot;\n\n# after setup.sh installed it into your project\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;&lt;product type&gt; &lt;industry&gt; &lt;keywords&gt;&quot; --design-system -p &quot;Project Name&quot;\u003c/code>\u003c/pre>\n\u003cp>Persist it so later sessions stay consistent:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">python3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;&lt;query&gt;&quot; --design-system --persist -p &quot;Project Name&quot; --output-dir .\u003c/code>\u003c/pre>\n\u003cp>That writes \u003ccode>design-system/&lt;slug&gt;/MASTER.md\u003c/code> (global truth) and lets page overrides live in \u003ccode>design-system/&lt;slug&gt;/pages/&lt;page&gt;.md\u003c/code>. Read the MASTER file before touching UI in later sessions. Never regenerate it with \u003ccode>--force\u003c/code> without the user asking.\u003c/p>\n\u003cp>If the skill is not installed and cannot be installed, fall back to hand-authored tokens, say so, and still follow the token rules below.\u003c/p>\n\u003cp>\u003cstrong>R3.\u003c/strong> One token layer, three tiers: primitive (\u003ccode>--color-blue-600\u003c/code>), semantic (\u003ccode>--color-surface\u003c/code>, \u003ccode>--color-text-muted\u003c/code>), component (\u003ccode>--button-bg\u003c/code>). Components reference semantic or component tokens only.\u003c/p>\n\u003cp>\u003cstrong>R4.\u003c/strong> Zero raw hex or magic pixel values inside components. Every color, radius, shadow, font size, and spacing step comes from a token. A grep for \u003ccode>#\u003c/code> or \u003ccode>px\u003c/code> in a component file should return almost nothing except 1px borders and similar primitives defined in the scale.\u003c/p>\n\u003cp>\u003cstrong>R5.\u003c/strong> Scales are fixed, not improvised:\u003c/p>\n\u003cul>\u003cli>spacing: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96\u003c/li>\u003cli>type: 12 / 14 / 16 / 20 / 24 / 30 / 38 / 48 / 60 (body 16, line-height 1.5 minimum)\u003c/li>\u003cli>radius: one base with two variants\u003c/li>\u003cli>shadow: 0 to 3 levels, no decorative shadows on flat surfaces\u003c/li>\u003cli>z-index: named layers only, never arbitrary numbers\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>R6.\u003c/strong> Dark mode is a token swap (\u003ccode>prefers-color-scheme\u003c/code> plus a class or \u003ccode>data-theme\u003c/code> override), never a second stylesheet and never a filter. Check contrast in both themes.\u003c/p>\n\u003cp>\u003cstrong>R7.\u003c/strong> Fonts: maximum two families, \u003ccode>font-display: swap\u003c/code>, subset where possible, self-host or preconnect. Never load five weights of three families for a landing page.\u003c/p>\n\u003chr>\n\u003ch3 id=\"phase-2-stack-and-scaffold\">Phase 2 - Stack and scaffold\u003c/h3>\n\u003cp>Choose with the decision tree. Do not default to React for a five-section marketing page, and do not default to plain HTML for an authenticated app.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Stack\u003c/th>\u003cth>Scaffold\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Marketing, docs, blog, content-first, SEO critical\u003c/td>\u003ctd>Astro (or Next.js if the team already uses it)\u003c/td>\u003ctd>\u003ccode>npm create astro@latest\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authenticated product, dashboard, multi-route app\u003c/td>\u003ctd>Next.js App Router + TypeScript\u003c/td>\u003ctd>\u003ccode>npx create-next-app@latest --ts --app --tailwind --eslint\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SPA inside an existing backend, heavy client state\u003c/td>\u003ctd>Vite + React + TypeScript\u003c/td>\u003ctd>\u003ccode>npm create vite@latest -- --template react-ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vue team\u003c/td>\u003ctd>Nuxt 3 or Vite + Vue 3\u003c/td>\u003ctd>\u003ccode>npx nuxi@latest init\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Svelte team\u003c/td>\u003ctd>SvelteKit\u003c/td>\u003ctd>\u003ccode>npx sv create\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Single deliverable, no build step, must open by double-click\u003c/td>\u003ctd>Hand-written HTML + CSS + minimal JS\u003c/td>\u003ctd>one \u003ccode>index.html\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Native mobile plus web\u003c/td>\u003ctd>React Native / Flutter (see \u003ccode>30-stack-playbooks.md\u003c/code>)\u003c/td>\u003ctd>native toolchain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>R8.\u003c/strong> TypeScript strict for any app that will live longer than a demo. No \u003ccode>any\u003c/code> to silence errors; fix the type or write a real \u003ccode>unknown\u003c/code> guard.\u003c/p>\n\u003cp>\u003cstrong>R9.\u003c/strong> Component library decision, in order of preference:\u003c/p>\n\u003col>\u003cli>Reuse what the repo already has.\u003c/li>\u003cli>Pull a real component from the 21st.dev catalog through the MCP server (see \u003ccode>60-mcp-and-skill-usage.md\u003c/code>), then adapt it to the project tokens.\u003c/li>\u003cli>Add shadcn/ui primitives (\u003ccode>npx shadcn@latest add &lt;component&gt;\u003c/code>) for accessible base behavior.\u003c/li>\u003cli>Write it by hand with full keyboard and ARIA support.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>R10.\u003c/strong> Every dependency must justify itself. State what it replaces. Banned without a written reason: moment, lodash (use natives), a CSS framework inside a Tailwind project, animation libraries for one fade, icon fonts, jQuery.\u003c/p>\n\u003cp>\u003cstrong>R11.\u003c/strong> Structure the app by feature, not by file type:\u003c/p>\n\u003cpre>\u003ccode>src/\n  app/            routes, layouts, route handlers\n  components/     shared, presentational, no data fetching\n    ui/           primitives (button, input, dialog)\n  features/&lt;x&gt;/   components + hooks + schema + tests for one domain\n  lib/            pure helpers, clients, config\n  styles/         tokens, globals\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>R12.\u003c/strong> Server state belongs to the server. Data fetching happens in server components, loaders, or route handlers, not in \u003ccode>useEffect\u003c/code> chains scattered through presentational components.\u003c/p>\n\u003chr>\n\u003ch3 id=\"phase-3-build-order\">Phase 3 - Build order\u003c/h3>\n\u003cp>Build in this order, in one pass each. Do not jump to polish before the shell exists.\u003c/p>\n\u003col>\u003cli>\u003cstrong>Tokens and globals\u003c/strong> (Phase 1 output).\u003c/li>\u003cli>\u003cstrong>Layout shell\u003c/strong>: root layout, nav, footer, page container, responsive grid. Verify at 375 / 768 / 1024 / 1440 before continuing.\u003c/li>\u003cli>\u003cstrong>Generic primitives\u003c/strong>: button, input, card, badge, dialog, table, toast. All states: default, hover, focus-visible, active, disabled, loading.\u003c/li>\u003cli>\u003cstrong>Sections or feature modules\u003c/strong>, top to bottom, real content.\u003c/li>\u003cli>\u003cstrong>States for every async surface\u003c/strong>: loading (skeleton that matches final layout), empty (explains the next action), error (what happened plus retry), success, and partial failure.\u003c/li>\u003cli>\u003cstrong>Forms\u003c/strong>: visible labels, inline validation on blur, errors next to the field, disabled state while submitting, success confirmation that says what happens next.\u003c/li>\u003cli>\u003cstrong>Motion pass\u003c/strong>: only where it explains something. 150-300ms, transform and opacity only, \u003ccode>prefers-reduced-motion\u003c/code> respected globally.\u003c/li>\u003cli>\u003cstrong>SEO and metadata\u003c/strong>: title, description, canonical, Open Graph image, \u003ccode>sitemap.xml\u003c/code>, \u003ccode>robots.txt\u003c/code>, semantic landmarks, JSON-LD for content pages.\u003c/li>\u003cli>\u003cstrong>Verify\u003c/strong> (Phase 4), then report (Phase 5).\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>R13.\u003c/strong> Loading states use skeletons shaped like the final content, not spinners in the middle of an empty page, and not layout shift when data lands.\u003c/p>\n\u003cp>\u003cstrong>R14.\u003c/strong> Every interactive element has: \u003ccode>cursor: pointer\u003c/code>, a hover state, a visible focus ring, and a 44x44px minimum touch target. Icon-only buttons carry an accessible label.\u003c/p>\n\u003cp>\u003cstrong>R15.\u003c/strong> Never use emoji as icons. Use SVG (Lucide, Heroicons, or the icon data in the UI/UX Pro Max skill).\u003c/p>\n\u003cp>\u003cstrong>R16.\u003c/strong> Empty states are designed, not blank. Copy explains why the area is empty and what to click.\u003c/p>\n\u003cp>\u003cstrong>R17.\u003c/strong> Copy is written, not lorem ipsum. Button labels are verbs. Error messages say what to do next, not \"Something went wrong\".\u003c/p>\n\u003cp>\u003cstrong>R18.\u003c/strong> Mobile-first CSS. Breakpoints are \u003ccode>sm 640\u003c/code>, \u003ccode>md 768\u003c/code>, \u003ccode>lg 1024\u003c/code>, \u003ccode>xl 1280\u003c/code>. No horizontal scroll at any width from 320px up. No fixed pixel container widths.\u003c/p>\n\u003cp>\u003cstrong>R19.\u003c/strong> Images: correct intrinsic \u003ccode>width\u003c/code>/\u003ccode>height\u003c/code> (or aspect-ratio) to prevent CLS, \u003ccode>loading=\"lazy\"\u003c/code> below the fold, \u003ccode>fetchpriority=\"high\"\u003c/code> on the hero, AVIF/WebP with fallback, responsive \u003ccode>sizes\u003c/code> and \u003ccode>srcset\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>R20.\u003c/strong> No layout thrashing: animate transform and opacity, never \u003ccode>width\u003c/code>, \u003ccode>height\u003c/code>, \u003ccode>top\u003c/code>, or \u003ccode>left\u003c/code>. No \u003ccode>scroll\u003c/code> handlers without throttling or IntersectionObserver.\u003c/p>\n\u003chr>\n\u003ch3 id=\"phase-4-accessibility-performance-security-gates\">Phase 4 - Accessibility, performance, security gates\u003c/h3>\n\u003cp>Full checklists are in \u003ccode>40-quality-gates.md\u003c/code>. The non-negotiables:\u003c/p>\n\u003cp>\u003cstrong>R21.\u003c/strong> WCAG 2.2 AA: text contrast 4.5:1 (3:1 for large text), visible focus, full keyboard operability, no keyboard traps, accessible names on all controls, \u003ccode>aria-live\u003c/code> for async status.\u003c/p>\n\u003cp>\u003cstrong>R22.\u003c/strong> Performance budgets: LCP under 2.5s on mid-tier mobile, CLS under 0.1, INP under 200ms, initial JS under 200KB gzipped for a marketing page, under 350KB for an app shell. Report the numbers you measured, and only the ones you measured.\u003c/p>\n\u003cp>\u003cstrong>R23.\u003c/strong> Security basics: no secrets in client code or the repo, validate and sanitize all input at the boundary (zod or equivalent), escape anything rendered as HTML (never \u003ccode>dangerouslySetInnerHTML\u003c/code> with user data), authenticate and authorize on the server, rate-limit public endpoints, keep dependencies current.\u003c/p>\n\u003cp>\u003cstrong>R24.\u003c/strong> Error handling: no silent catches. Log server errors, show the user a recoverable message with a retry, and add an error boundary or route-level error file so one failure does not blank the app.\u003c/p>\n\u003cp>\u003cstrong>R25.\u003c/strong> Types, lint, build must all pass before you say the work is done. Run them yourself:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">npm run typecheck --if-present &amp;&amp; npm run lint --if-present &amp;&amp; npm run build\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch3 id=\"phase-5-report\">Phase 5 - Report\u003c/h3>\n\u003cp>Close every build with this block, in this order, short:\u003c/p>\n\u003cpre>\u003ccode>Built:      &lt;what exists now, file paths&gt;\nRan:        &lt;exact commands and their real result&gt;\nTokens:     design-system/&lt;slug&gt;/MASTER.md (from UI/UX Pro Max)\nChecked:    375/768/1024/1440, keyboard pass, contrast, reduced motion\nNot done:   &lt;honest gaps, TODO(content) markers, unverified items&gt;\nNext:       &lt;one or two concrete next actions&gt;\u003c/code>\u003c/pre>\n\u003cp>No summary of what the code does line by line. No victory speech.\u003c/p>\n\u003chr>\n\u003ch3 id=\"anti-pattern-list-instant-reject\">Anti-pattern list (instant reject)\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Never\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Purple-to-blue gradient hero with three identical feature cards\u003c/td>\u003ctd>Every AI-generated site looks like this. Differentiate or justify.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Emoji as icons, lorem ipsum, \"Lorem\" placeholders left in code\u003c/td>\u003ctd>Visible amateur tell\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Three fonts, four weights, five radii, random hex codes\u003c/td>\u003ctd>No system, no coherence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinner-only loading, blank empty states, generic error toasts\u003c/td>\u003ctd>Unfinished\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>useEffect\u003c/code> data fetching in every component\u003c/td>\u003ctd>Waterfalls, race conditions, no caching\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hover-only affordances, \u003ccode>outline: none\u003c/code> without replacement\u003c/td>\u003ctd>Breaks keyboard and touch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Animating \u003ccode>height\u003c/code>/\u003ccode>width\u003c/code>, 1s transitions, no reduced-motion\u003c/td>\u003ctd>Jank and accessibility failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Right-aligned \u003ccode>!important\u003c/code> patches and \u003ccode>style={{}}\u003c/code> overrides\u003c/td>\u003ctd>Fights the design system\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client-side-only auth checks or secrets in \u003ccode>NEXT_PUBLIC_*\u003c/code>\u003c/td>\u003ctd>Security hole\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copying a component without reading its dependencies\u003c/td>\u003ctd>Breaks the build\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claiming tests/build passed without running them\u003c/td>\u003ctd>Dishonest\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"definition-of-done\">Definition of done\u003c/h3>\n\u003cul>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Tokens define every color, space, type size, radius, shadow used in the UI\" disabled> Tokens define every color, space, type size, radius, shadow used in the UI\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Design system generated or adapted, persisted, and referenced\" disabled> Design system generated or adapted, persisted, and referenced\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"All four states implemented for every async surface\" disabled> All four states implemented for every async surface\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Responsive verified at 320, 375, 768, 1024, 1440, no horizontal scroll\" disabled> Responsive verified at 320, 375, 768, 1024, 1440, no horizontal scroll\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Keyboard traversal complete, focus visible, no traps, no mouse-only features\" disabled> Keyboard traversal complete, focus visible, no traps, no mouse-only features\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Contrast checked in light and dark themes\" disabled> Contrast checked in light and dark themes\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Reduced motion respected\" disabled> Reduced motion respected\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Meta tags, OG image, sitemap, robots, semantic landmarks, one h1 per page\" disabled> Meta tags, OG image, sitemap, robots, semantic landmarks, one \u003ccode>h1\u003c/code> per page\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Images sized and optimized, fonts swapped, no CLS from media\" disabled> Images sized and optimized, fonts swapped, no CLS from media\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"typecheck , lint , build pass with real output shown\" disabled> \u003ccode>typecheck\u003c/code>, \u003ccode>lint\u003c/code>, \u003ccode>build\u003c/code> pass with real output shown\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"No secrets, no committed .env , no stray console.log , no dead files\" disabled> No secrets, no committed \u003ccode>.env\u003c/code>, no stray \u003ccode>console.log\u003c/code>, no dead files\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Report block written with honest gaps\" disabled> Report block written with honest gaps\u003c/li>\u003c/ul>", "md": "# 10 - Webapp generation protocol\n\nThis is the build law for any request that creates or changes a web application: landing pages, dashboards, SaaS products, admin panels, docs sites, internal tools, single-file HTML deliverables.\n\nRead `00-core.md` first (voice and accuracy), then this file top to bottom. Rules are numbered so they can be cited in reviews.\n\n---\n\n## Phase 0 - Intake (before any code)\n\nExtract these eight facts from the request. If four or more are missing, ask up to three questions that change the architecture. Otherwise write the assumption list in one short block and proceed.\n\n1. **Product**: what it is, in one sentence, and who it is for.\n2. **Job to be done**: the single action the primary user must complete.\n3. **Surface**: marketing page, app shell, dashboard, tool, docs, or embed.\n4. **Stack**: detected from the repo when one exists (`package.json`, `pubspec.yaml`, `*.xcodeproj`, `composer.json`), or chosen from the decision tree below. Never silently default a stack.\n5. **Content**: real copy, real data, real assets. If none exist, mark every placeholder with `TODO(content)` and keep it obvious.\n6. **Constraints**: framework version, design system, brand tokens, browser support, offline, i18n, budget.\n7. **Integrations**: auth, payments, database, analytics, third-party APIs.\n8. **Done means**: what the user will run or click to accept the work.\n\n**R1.** Never start from a blank file when a repo exists. Read `package.json`, existing components, tokens, and routing before writing. Match what is there.\n\n---\n\n## Phase 1 - Design system before components\n\n**R2.** No page-level styling before tokens exist. Tokens are the contract; components consume them.\n\nRun the design intelligence search that ships with this kit (UI/UX Pro Max) and use its output as the source of truth:\n\n```bash\n# in this repo\npython3 skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct type> \u003cindustry> \u003ckeywords>\" --design-system -p \"Project Name\"\n\n# after setup.sh installed it into your project\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py \"\u003cproduct type> \u003cindustry> \u003ckeywords>\" --design-system -p \"Project Name\"\n```\n\nPersist it so later sessions stay consistent:\n\n```bash\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py \"\u003cquery>\" --design-system --persist -p \"Project Name\" --output-dir .\n```\n\nThat writes `design-system/\u003cslug>/MASTER.md` (global truth) and lets page overrides live in `design-system/\u003cslug>/pages/\u003cpage>.md`. Read the MASTER file before touching UI in later sessions. Never regenerate it with `--force` without the user asking.\n\nIf the skill is not installed and cannot be installed, fall back to hand-authored tokens, say so, and still follow the token rules below.\n\n**R3.** One token layer, three tiers: primitive (`--color-blue-600`), semantic (`--color-surface`, `--color-text-muted`), component (`--button-bg`). Components reference semantic or component tokens only.\n\n**R4.** Zero raw hex or magic pixel values inside components. Every color, radius, shadow, font size, and spacing step comes from a token. A grep for `#` or `px` in a component file should return almost nothing except 1px borders and similar primitives defined in the scale.\n\n**R5.** Scales are fixed, not improvised:\n- spacing: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96\n- type: 12 / 14 / 16 / 20 / 24 / 30 / 38 / 48 / 60 (body 16, line-height 1.5 minimum)\n- radius: one base with two variants\n- shadow: 0 to 3 levels, no decorative shadows on flat surfaces\n- z-index: named layers only, never arbitrary numbers\n\n**R6.** Dark mode is a token swap (`prefers-color-scheme` plus a class or `data-theme` override), never a second stylesheet and never a filter. Check contrast in both themes.\n\n**R7.** Fonts: maximum two families, `font-display: swap`, subset where possible, self-host or preconnect. Never load five weights of three families for a landing page.\n\n---\n\n## Phase 2 - Stack and scaffold\n\nChoose with the decision tree. Do not default to React for a five-section marketing page, and do not default to plain HTML for an authenticated app.\n\n| Situation | Stack | Scaffold |\n|---|---|---|\n| Marketing, docs, blog, content-first, SEO critical | Astro (or Next.js if the team already uses it) | `npm create astro@latest` |\n| Authenticated product, dashboard, multi-route app | Next.js App Router + TypeScript | `npx create-next-app@latest --ts --app --tailwind --eslint` |\n| SPA inside an existing backend, heavy client state | Vite + React + TypeScript | `npm create vite@latest -- --template react-ts` |\n| Vue team | Nuxt 3 or Vite + Vue 3 | `npx nuxi@latest init` |\n| Svelte team | SvelteKit | `npx sv create` |\n| Single deliverable, no build step, must open by double-click | Hand-written HTML + CSS + minimal JS | one `index.html` |\n| Native mobile plus web | React Native / Flutter (see `30-stack-playbooks.md`) | native toolchain |\n\n**R8.** TypeScript strict for any app that will live longer than a demo. No `any` to silence errors; fix the type or write a real `unknown` guard.\n\n**R9.** Component library decision, in order of preference:\n1. Reuse what the repo already has.\n2. Pull a real component from the 21st.dev catalog through the MCP server (see `60-mcp-and-skill-usage.md`), then adapt it to the project tokens.\n3. Add shadcn/ui primitives (`npx shadcn@latest add \u003ccomponent>`) for accessible base behavior.\n4. Write it by hand with full keyboard and ARIA support.\n\n**R10.** Every dependency must justify itself. State what it replaces. Banned without a written reason: moment, lodash (use natives), a CSS framework inside a Tailwind project, animation libraries for one fade, icon fonts, jQuery.\n\n**R11.** Structure the app by feature, not by file type:\n\n```\nsrc/\n  app/            routes, layouts, route handlers\n  components/     shared, presentational, no data fetching\n    ui/           primitives (button, input, dialog)\n  features/\u003cx>/   components + hooks + schema + tests for one domain\n  lib/            pure helpers, clients, config\n  styles/         tokens, globals\n```\n\n**R12.** Server state belongs to the server. Data fetching happens in server components, loaders, or route handlers, not in `useEffect` chains scattered through presentational components.\n\n---\n\n## Phase 3 - Build order\n\nBuild in this order, in one pass each. Do not jump to polish before the shell exists.\n\n1. **Tokens and globals** (Phase 1 output).\n2. **Layout shell**: root layout, nav, footer, page container, responsive grid. Verify at 375 / 768 / 1024 / 1440 before continuing.\n3. **Generic primitives**: button, input, card, badge, dialog, table, toast. All states: default, hover, focus-visible, active, disabled, loading.\n4. **Sections or feature modules**, top to bottom, real content.\n5. **States for every async surface**: loading (skeleton that matches final layout), empty (explains the next action), error (what happened plus retry), success, and partial failure.\n6. **Forms**: visible labels, inline validation on blur, errors next to the field, disabled state while submitting, success confirmation that says what happens next.\n7. **Motion pass**: only where it explains something. 150-300ms, transform and opacity only, `prefers-reduced-motion` respected globally.\n8. **SEO and metadata**: title, description, canonical, Open Graph image, `sitemap.xml`, `robots.txt`, semantic landmarks, JSON-LD for content pages.\n9. **Verify** (Phase 4), then report (Phase 5).\n\n**R13.** Loading states use skeletons shaped like the final content, not spinners in the middle of an empty page, and not layout shift when data lands.\n\n**R14.** Every interactive element has: `cursor: pointer`, a hover state, a visible focus ring, and a 44x44px minimum touch target. Icon-only buttons carry an accessible label.\n\n**R15.** Never use emoji as icons. Use SVG (Lucide, Heroicons, or the icon data in the UI/UX Pro Max skill).\n\n**R16.** Empty states are designed, not blank. Copy explains why the area is empty and what to click.\n\n**R17.** Copy is written, not lorem ipsum. Button labels are verbs. Error messages say what to do next, not \"Something went wrong\".\n\n**R18.** Mobile-first CSS. Breakpoints are `sm 640`, `md 768`, `lg 1024`, `xl 1280`. No horizontal scroll at any width from 320px up. No fixed pixel container widths.\n\n**R19.** Images: correct intrinsic `width`/`height` (or aspect-ratio) to prevent CLS, `loading=\"lazy\"` below the fold, `fetchpriority=\"high\"` on the hero, AVIF/WebP with fallback, responsive `sizes` and `srcset`.\n\n**R20.** No layout thrashing: animate transform and opacity, never `width`, `height`, `top`, or `left`. No `scroll` handlers without throttling or IntersectionObserver.\n\n---\n\n## Phase 4 - Accessibility, performance, security gates\n\nFull checklists are in `40-quality-gates.md`. The non-negotiables:\n\n**R21.** WCAG 2.2 AA: text contrast 4.5:1 (3:1 for large text), visible focus, full keyboard operability, no keyboard traps, accessible names on all controls, `aria-live` for async status.\n\n**R22.** Performance budgets: LCP under 2.5s on mid-tier mobile, CLS under 0.1, INP under 200ms, initial JS under 200KB gzipped for a marketing page, under 350KB for an app shell. Report the numbers you measured, and only the ones you measured.\n\n**R23.** Security basics: no secrets in client code or the repo, validate and sanitize all input at the boundary (zod or equivalent), escape anything rendered as HTML (never `dangerouslySetInnerHTML` with user data), authenticate and authorize on the server, rate-limit public endpoints, keep dependencies current.\n\n**R24.** Error handling: no silent catches. Log server errors, show the user a recoverable message with a retry, and add an error boundary or route-level error file so one failure does not blank the app.\n\n**R25.** Types, lint, build must all pass before you say the work is done. Run them yourself:\n\n```bash\nnpm run typecheck --if-present && npm run lint --if-present && npm run build\n```\n\n---\n\n## Phase 5 - Report\n\nClose every build with this block, in this order, short:\n\n```\nBuilt:      \u003cwhat exists now, file paths>\nRan:        \u003cexact commands and their real result>\nTokens:     design-system/\u003cslug>/MASTER.md (from UI/UX Pro Max)\nChecked:    375/768/1024/1440, keyboard pass, contrast, reduced motion\nNot done:   \u003chonest gaps, TODO(content) markers, unverified items>\nNext:       \u003cone or two concrete next actions>\n```\n\nNo summary of what the code does line by line. No victory speech.\n\n---\n\n## Anti-pattern list (instant reject)\n\n| Never | Why |\n|---|---|\n| Purple-to-blue gradient hero with three identical feature cards | Every AI-generated site looks like this. Differentiate or justify. |\n| Emoji as icons, lorem ipsum, \"Lorem\" placeholders left in code | Visible amateur tell |\n| Three fonts, four weights, five radii, random hex codes | No system, no coherence |\n| Spinner-only loading, blank empty states, generic error toasts | Unfinished |\n| `useEffect` data fetching in every component | Waterfalls, race conditions, no caching |\n| Hover-only affordances, `outline: none` without replacement | Breaks keyboard and touch |\n| Animating `height`/`width`, 1s transitions, no reduced-motion | Jank and accessibility failure |\n| Right-aligned `!important` patches and `style={{}}` overrides | Fights the design system |\n| Client-side-only auth checks or secrets in `NEXT_PUBLIC_*` | Security hole |\n| Copying a component without reading its dependencies | Breaks the build |\n| Claiming tests/build passed without running them | Dishonest |\n\n## Definition of done\n\n- [ ] Tokens define every color, space, type size, radius, shadow used in the UI\n- [ ] Design system generated or adapted, persisted, and referenced\n- [ ] All four states implemented for every async surface\n- [ ] Responsive verified at 320, 375, 768, 1024, 1440, no horizontal scroll\n- [ ] Keyboard traversal complete, focus visible, no traps, no mouse-only features\n- [ ] Contrast checked in light and dark themes\n- [ ] Reduced motion respected\n- [ ] Meta tags, OG image, sitemap, robots, semantic landmarks, one `h1` per page\n- [ ] Images sized and optimized, fonts swapped, no CLS from media\n- [ ] `typecheck`, `lint`, `build` pass with real output shown\n- [ ] No secrets, no committed `.env`, no stray `console.log`, no dead files\n- [ ] Report block written with honest gaps\n", "headings": [{"id": "10-webapp-generation-protocol", "text": "10 - Webapp generation protocol", "level": "2"}, {"id": "phase-0-intake-before-any-code", "text": "Phase 0 - Intake (before any code)", "level": "3"}, {"id": "phase-1-design-system-before-components", "text": "Phase 1 - Design system before components", "level": "3"}, {"id": "phase-2-stack-and-scaffold", "text": "Phase 2 - Stack and scaffold", "level": "3"}, {"id": "phase-3-build-order", "text": "Phase 3 - Build order", "level": "3"}, {"id": "phase-4-accessibility-performance-security-gates", "text": "Phase 4 - Accessibility, performance, security gates", "level": "3"}, {"id": "phase-5-report", "text": "Phase 5 - Report", "level": "3"}, {"id": "anti-pattern-list-instant-reject", "text": "Anti-pattern list (instant reject)", "level": "3"}, {"id": "definition-of-done", "text": "Definition of done", "level": "3"}]}, {"id": "uiux", "title": "20 - UI/UX rules", "group": "Instructions", "source": "instructions/20-ui-ux-rules.md", "html": "\u003ch2 id=\"20-ui-ux-rules-priority-ordered\">20 - UI/UX rules (priority ordered)\u003c/h2>\n\u003cp>The 22-stack, 79-style, 192-palette design database lives in \u003ccode>skills/ui-ux-pro-max/\u003c/code>. This file is the part every agent must carry in its head: the priority order, the checks, the anti-patterns.\u003c/p>\n\u003ch3 id=\"priority-order\">Priority order\u003c/h3>\n\u003cp>Fix in this order. A beautiful page with a broken contrast ratio is a broken page.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Category\u003c/th>\u003cth>Impact\u003c/th>\u003cth>Must have\u003c/th>\u003cth>Anti-pattern\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Accessibility\u003c/td>\u003ctd>CRITICAL\u003c/td>\u003ctd>4.5:1 contrast, alt text, keyboard path, aria labels\u003c/td>\u003ctd>removing focus rings, icon-only buttons with no label\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Touch and interaction\u003c/td>\u003ctd>CRITICAL\u003c/td>\u003ctd>44x44px targets, 8px+ spacing, press/loading feedback\u003c/td>\u003ctd>hover-only affordances, 0ms state changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Performance\u003c/td>\u003ctd>HIGH\u003c/td>\u003ctd>WebP/AVIF, lazy below fold, reserved space (CLS &lt; 0.1)\u003c/td>\u003ctd>layout thrash, unsized media\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Style selection\u003c/td>\u003ctd>HIGH\u003c/td>\u003ctd>one language, matched to product type, SVG icons\u003c/td>\u003ctd>mixing flat and skeuomorphic, emoji as icons\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Layout and responsive\u003c/td>\u003ctd>HIGH\u003c/td>\u003ctd>mobile-first breakpoints, viewport meta, no h-scroll\u003c/td>\u003ctd>fixed px containers, zoom disabled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Typography and color\u003c/td>\u003ctd>MEDIUM\u003c/td>\u003ctd>16px base, 1.5 line-height, semantic tokens\u003c/td>\u003ctd>12px body text, gray-on-gray, hex in components\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Animation\u003c/td>\u003ctd>MEDIUM\u003c/td>\u003ctd>150-300ms, meaning-carrying, reduced motion\u003c/td>\u003ctd>one duration everywhere, animating layout props\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Forms and feedback\u003c/td>\u003ctd>MEDIUM\u003c/td>\u003ctd>visible labels, inline errors, helper text\u003c/td>\u003ctd>placeholder-only labels, errors only at the top\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Navigation\u003c/td>\u003ctd>HIGH\u003c/td>\u003ctd>predictable back, \u22645 bottom-nav items, deep links\u003c/td>\u003ctd>overloaded nav, broken back button\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Charts and data\u003c/td>\u003ctd>LOW\u003c/td>\u003ctd>legends, tooltips, non-color encoding\u003c/td>\u003ctd>color as the only signal\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"layout\">Layout\u003c/h3>\n\u003cul>\u003cli>One primary action per screen. If two elements compete, demote one.\u003c/li>\u003cli>Establish hierarchy with size, weight, and space before color.\u003c/li>\u003cli>Use a 12-column grid on desktop, single column on mobile. Gutters from the spacing scale.\u003c/li>\u003cli>Vertical rhythm: section padding 64-96px desktop, 40-56px mobile. Do not improvise.\u003c/li>\u003cli>Max content width 60-75 characters for prose, 1280px for app shells.\u003c/li>\u003cli>Density is a decision: marketing is spacious (24-96px scale), dashboards are dense (8-32px scale). Pick once per surface.\u003c/li>\u003cli>Alignment beats decoration. Everything sits on the same grid.\u003c/li>\u003c/ul>\n\u003ch3 id=\"typography\">Typography\u003c/h3>\n\u003cul>\u003cli>Two families maximum: one for headings/display, one for UI/body. Often one is enough.\u003c/li>\u003cli>Body 16px minimum, line-height 1.5-1.7, paragraph max width 70ch.\u003c/li>\u003cli>Weights: use 2-3, not 6. Use size and color for emphasis before heavy weights.\u003c/li>\u003cli>Never justify text. Never letter-space body copy. Balance headings (\u003ccode>text-wrap: balance\u003c/code>), avoid orphans.\u003c/li>\u003cli>Numeric tables and stats get tabular numerals (\u003ccode>font-variant-numeric: tabular-nums\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"color\">Color\u003c/h3>\n\u003cul>\u003cli>60/30/10: neutral surface, secondary tone, accent.\u003c/li>\u003cli>Accent color is reserved for the primary action. If everything is accent-colored, nothing is.\u003c/li>\u003cli>Semantic naming only in components: \u003ccode>--color-surface\u003c/code>, \u003ccode>--color-danger\u003c/code>, \u003ccode>--color-border\u003c/code>.\u003c/li>\u003cli>Text on colored fills: check 4.5:1 against the fill, not against white.\u003c/li>\u003cli>Never signal state with color alone. Pair with icon, label, or shape.\u003c/li>\u003cli>Dark mode is not inverted light mode: reduce saturation, keep contrast, avoid pure black on pure white.\u003c/li>\u003c/ul>\n\u003ch3 id=\"space-and-surface\">Space and surface\u003c/h3>\n\u003cul>\u003cli>Space communicates grouping. Related items closer, unrelated items farther. No exceptions for aesthetics.\u003c/li>\u003cli>Three shadow levels maximum, all from tokens. Flat surfaces stay flat.\u003c/li>\u003cli>Borders and shadows are alternatives, not both, unless the design system says otherwise.\u003c/li>\u003cli>Radius is a system decision: one scale, applied consistently (buttons and inputs share it).\u003c/li>\u003c/ul>\n\u003ch3 id=\"motion\">Motion\u003c/h3>\n\u003cul>\u003cli>Durations: 100-150ms micro (hover, press), 200-300ms transitions (drawer, modal), 300-500ms only for meaningful choreography.\u003c/li>\u003cli>Easing: ease-out for entrances, ease-in for exits, ease-in-out for movement.\u003c/li>\u003cli>Animate \u003ccode>transform\u003c/code> and \u003ccode>opacity\u003c/code>. Nothing else unless you measured it.\u003c/li>\u003cli>Motion explains state change or spatial relationship. Decorative animation is a liability.\u003c/li>\u003cli>Every animation respects \u003ccode>@media (prefers-reduced-motion: reduce)\u003c/code> and provides a static final state.\u003c/li>\u003c/ul>\n\u003ch3 id=\"forms\">Forms\u003c/h3>\n\u003cul>\u003cli>Label above the field, always visible. Placeholder is an example, never a label.\u003c/li>\u003cli>Validate on blur and on submit, not on every keystroke.\u003c/li>\u003cli>Error text next to the field, in text as well as color, with \u003ccode>aria-describedby\u003c/code> wired up.\u003c/li>\u003cli>Autofocus the first field on a dedicated form page; never autofocus on mobile keyboards that cover the CTA.\u003c/li>\u003cli>Submit button shows loading state and is disabled while pending. Prevent double submits.\u003c/li>\u003cli>Multi-step: show progress, allow going back, preserve entered data.\u003c/li>\u003cli>Success tells the user what happens next (\"We sent a link to your@email.com\").\u003c/li>\u003c/ul>\n\u003ch3 id=\"navigation\">Navigation\u003c/h3>\n\u003cul>\u003cli>Desktop: horizontal nav, current item visibly marked, no more than 7 top-level items.\u003c/li>\u003cli>Mobile: bottom nav for up to 5 app destinations, or a drawer for overflow. Never both for the same items.\u003c/li>\u003cli>Breadcrumbs for anything 3 levels deep, in apps with hierarchy.\u003c/li>\u003cli>Browser back must work. No route changes without history entries. Filters and tabs belong in the URL.\u003c/li>\u003cli>Deep links: every meaningful view has a URL that restores it.\u003c/li>\u003c/ul>\n\u003ch3 id=\"data-display\">Data display\u003c/h3>\n\u003cul>\u003cli>Tables: right-align numbers, left-align text, sticky header past 20 rows, sortable columns get an indicator, empty state explains itself.\u003c/li>\u003cli>Charts: label axes, no 3D, no truncated y-axis on bar charts, accessible color sequence plus shape/label alternatives.\u003c/li>\u003cli>Dashboards: KPI above the fold, trend next, detail below. Every number has a time range and a comparison.\u003c/li>\u003cli>Skeletons for tables and cards, not spinners.\u003c/li>\u003cli>Format numbers, dates, and currency with \u003ccode>Intl\u003c/code>. Locale-aware, never hand-rolled string math.\u003c/li>\u003c/ul>\n\u003ch3 id=\"component-states\">Component states\u003c/h3>\n\u003cp>Every interactive component defines all of: default, hover, focus-visible, active, disabled, loading, error (where applicable), empty (where applicable), and overlong-content behavior. Truncate with a tooltip or wrap, never clip silently.\u003c/p>\n\u003ch3 id=\"content\">Content\u003c/h3>\n\u003cul>\u003cli>Button labels are verbs that describe the outcome (\"Create project\", not \"Submit\").\u003c/li>\u003cli>Empty states: what this is, why it is empty, one action.\u003c/li>\u003cli>Error copy: what failed, what to do next, whether data was saved.\u003c/li>\u003cli>Microcopy is specific. \"We'll email you a receipt\" beats \"Your request was processed\".\u003c/li>\u003c/ul>\n\u003ch3 id=\"pre-delivery-checklist-copy-into-the-pr\">Pre-delivery checklist (copy into the PR)\u003c/h3>\n\u003cul>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"No emoji used as icons\" disabled> No emoji used as icons\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"cursor: pointer on all clickable elements\" disabled> \u003ccode>cursor: pointer\u003c/code> on all clickable elements\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Hover states with 150-300ms transitions\" disabled> Hover states with 150-300ms transitions\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Text contrast 4.5:1 in light theme\" disabled> Text contrast 4.5:1 in light theme\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Text contrast 4.5:1 in dark theme\" disabled> Text contrast 4.5:1 in dark theme\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Visible focus state for keyboard navigation\" disabled> Visible focus state for keyboard navigation\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"prefers-reduced-motion respected\" disabled> \u003ccode>prefers-reduced-motion\u003c/code> respected\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Responsive verified at 375, 768, 1024, 1440\" disabled> Responsive verified at 375, 768, 1024, 1440\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"No horizontal scroll at 320px\" disabled> No horizontal scroll at 320px\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Empty, loading, error states designed\" disabled> Empty, loading, error states designed\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"Images sized, lazy below fold, hero prioritized\" disabled> Images sized, lazy below fold, hero prioritized\u003c/li>\u003cli class=\"task\">\u003cinput type=\"checkbox\" aria-label=\"All interactive elements keyboard reachable with accessible names\" disabled> All interactive elements keyboard reachable with accessible names\u003c/li>\u003c/ul>\n\u003ch3 id=\"deeper-search\">Deeper search\u003c/h3>\n\u003cp>Query the skill with a single dominant intent and 2-5 terms. One domain at a time.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">python3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;error summary validation&quot; --domain ux\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;glassmorphism dark&quot; --domain style\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;fintech trust&quot; --domain color\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;saas modern clean&quot; --domain typography\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;virtualized list&quot; --stack react\npython3 .claude/skills/ui-ux-pro-max/scripts/search.py &quot;streaming suspense&quot; --stack nextjs\u003c/code>\u003c/pre>\n\u003cp>Domains: \u003ccode>style color chart landing product ux typography icons gsap react web google-fonts\u003c/code>. Stacks: \u003ccode>react nextjs vue svelte astro swiftui react-native flutter nuxtjs nuxt-ui html-tailwind shadcn jetpack-compose threejs angular laravel javafx wpf winui avalonia uno uwp\u003c/code>.\u003c/p>\n\u003cp>If a query returns nothing useful, retry once with a narrower rewrite. If that fails, say no verified match was found and label your fallback as general guidance. Do not persist unverified output into the design system.\u003c/p>", "md": "# 20 - UI/UX rules (priority ordered)\n\nThe 22-stack, 79-style, 192-palette design database lives in `skills/ui-ux-pro-max/`. This file is the part every agent must carry in its head: the priority order, the checks, the anti-patterns.\n\n## Priority order\n\nFix in this order. A beautiful page with a broken contrast ratio is a broken page.\n\n| # | Category | Impact | Must have | Anti-pattern |\n|---|---|---|---|---|\n| 1 | Accessibility | CRITICAL | 4.5:1 contrast, alt text, keyboard path, aria labels | removing focus rings, icon-only buttons with no label |\n| 2 | Touch and interaction | CRITICAL | 44x44px targets, 8px+ spacing, press/loading feedback | hover-only affordances, 0ms state changes |\n| 3 | Performa
